<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:#0d0d1a;font-family:system-ui,-apple-system,sans-serif;color:#e0e0ff}
#app{min-height:100vh;background:linear-gradient(135deg,#0d0d1a 0%,#0f0f2e 50%,#0a0a1f 100%);padding:12px;display:flex;flex-direction:column;gap:10px}
/* Header */
#header{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:8px;padding:10px 14px;background:rgba(255,255,255,0.04);border-radius:14px;border:1px solid rgba(120,80,255,0.2)}
#header h1{font-size:17px;font-weight:500;color:#c9b8ff;letter-spacing:1.5px}
#status-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
#xp-bar-wrap{width:80px;height:6px;background:rgba(255,255,255,0.1);border-radius:4px;overflow:hidden}
#xp-bar{height:100%;width:0%;background:linear-gradient(90deg,#7c3aed,#a78bfa);border-radius:4px;transition:width 0.5s ease}
#xp-txt{font-size:11px;color:#a78bfa;min-width:44px;text-align:right}
#progress-txt{font-size:11px;color:#7dd3fc;white-space:nowrap}
#sound-btn{background:none;border:1px solid rgba(120,80,255,0.3);border-radius:8px;color:#c9b8ff;font-size:11px;padding:4px 10px;cursor:pointer;transition:all 0.2s;white-space:nowrap}
#sound-btn:hover{background:rgba(120,80,255,0.15);border-color:#a78bfa}
/* Drawing Picker */
#drawing-picker{display:flex;gap:6px;overflow-x:auto;padding:4px 0;scrollbar-width:none}
#drawing-picker::-webkit-scrollbar{display:none}
.draw-btn{flex-shrink:0;padding:6px 14px;border-radius:20px;border:1px solid rgba(120,80,255,0.3);background:rgba(255,255,255,0.03);color:#c4b5fd;font-size:12px;cursor:pointer;transition:all 0.2s;white-space:nowrap;position:relative}
.draw-btn.active{background:rgba(120,80,255,0.25);border-color:#a78bfa;color:#e9d5ff;box-shadow:0 0 8px rgba(167,139,250,0.2)}
.draw-btn:hover{background:rgba(120,80,255,0.12)}
.draw-btn .done-tick{color:#34d399;margin-left:3px}
/* Canvas */
#canvas-wrap{flex:1;display:flex;justify-content:center;align-items:center;background:rgba(255,255,255,0.02);border-radius:18px;border:1px solid rgba(120,80,255,0.15);min-height:300px;position:relative;overflow:hidden;padding:16px}
#canvas-wrap::before{content:'';position:absolute;inset:0;background:radial-gradient(ellipse at 50% 50%,rgba(120,80,255,0.05) 0%,transparent 70%);pointer-events:none;border-radius:18px}
#drawing-svg{width:100%;max-width:380px;height:auto;cursor:pointer;display:block}
#drawing-svg.eyedrop{cursor:crosshair}
.region{transition:filter 0.25s ease,stroke 0.2s ease;stroke-width:1.5;stroke:#2a1f5c}
.region:hover{filter:brightness(1.3);stroke:#9d7aff;stroke-width:2}
.region.painted{stroke:#6d28d9;stroke-width:2}
/* Palette */
#palette-wrap{padding:12px;background:rgba(255,255,255,0.03);border-radius:14px;border:1px solid rgba(120,80,255,0.15);display:flex;flex-direction:column;gap:10px}
#palette-row{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.clr-mode{display:flex;gap:6px;justify-content:center}
.mode-btn{padding:4px 12px;border-radius:14px;border:1px solid rgba(120,80,255,0.3);background:rgba(255,255,255,0.03);color:#c4b5fd;font-size:11px;cursor:pointer;transition:all 0.2s}
.mode-btn.active{background:rgba(120,80,255,0.25);border-color:#a78bfa;box-shadow:0 0 6px rgba(167,139,250,0.2)}
.swatch{width:36px;height:36px;border-radius:50%;cursor:pointer;border:2px solid transparent;transition:transform 0.15s ease,box-shadow 0.2s,border-color 0.2s}
.swatch:hover{transform:scale(1.15)}
.swatch.selected{border-color:#fff;box-shadow:0 0 0 2px rgba(255,255,255,0.25),0 0 12px rgba(167,139,250,0.5);transform:scale(1.1)}
/* Tools */
#tool-row{display:flex;gap:6px;justify-content:center;flex-wrap:wrap}
.tool-btn{flex:1;min-width:64px;max-width:110px;padding:9px 6px;border-radius:12px;border:1px solid rgba(120,80,255,0.25);background:rgba(255,255,255,0.03);color:#c4b5fd;font-size:12px;cursor:pointer;transition:all 0.2s;text-align:center;display:flex;flex-direction:column;align-items:center;gap:2px;line-height:1.1}
.tool-btn .ic{font-size:16px}
.tool-btn:hover{background:rgba(120,80,255,0.15);border-color:#a78bfa;color:#e9d5ff}
.tool-btn:active{transform:scale(0.96)}
.tool-btn.active{background:rgba(120,80,255,0.3);border-color:#a78bfa;color:#e9d5ff;box-shadow:0 0 8px rgba(167,139,250,0.3)}
.tool-btn:disabled{opacity:0.35;cursor:not-allowed}
/* Complete overlay */
#complete-msg{display:none;position:absolute;inset:0;background:rgba(10,8,28,0.92);border-radius:17px;flex-direction:column;align-items:center;justify-content:center;gap:14px;z-index:10;backdrop-filter:blur(4px)}
#complete-msg.show{display:flex;animation:fadeIn 0.5s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
#complete-msg .emoji-big{font-size:52px;animation:popBig 0.6s cubic-bezier(.34,1.56,.64,1)}
@keyframes popBig{from{transform:scale(0) rotate(-30deg);opacity:0}to{transform:scale(1) rotate(0);opacity:1}}
#complete-msg p{font-size:22px;color:#e9d5ff;font-weight:500;text-align:center}
#complete-msg small{font-size:13px;color:#a78bfa;text-align:center}
#complete-msg .cbtns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
#complete-msg button{padding:10px 22px;border-radius:14px;background:rgba(120,80,255,0.3);border:1px solid #a78bfa;color:#e9d5ff;font-size:14px;cursor:pointer;transition:all 0.2s}
#complete-msg button:hover{background:rgba(120,80,255,0.5)}
#complete-msg button.ghost{background:transparent}
/* Toast */
#unlock-toast{display:none;position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:rgba(80,40,180,0.9);color:#e9d5ff;padding:9px 20px;border-radius:20px;font-size:13px;z-index:200;pointer-events:none;border:1px solid rgba(167,139,250,0.4);backdrop-filter:blur(6px)}
#unlock-toast.show{display:block;animation:slideUp 0.4s ease}
@keyframes slideUp{from{opacity:0;transform:translateX(-50%) translateY(12px)}to{opacity:1;transform:translateX(-50%) translateY(0)}}
/* Glow anim on paint */
@keyframes glowIn{0%{filter:brightness(2.5) saturate(2)}60%{filter:brightness(1.4)}100%{filter:brightness(1) saturate(1)}}
.glow-anim{animation:glowIn 0.7s ease forwards}
/* Sparkles + confetti */
.spark{position:absolute;width:7px;height:7px;border-radius:50%;pointer-events:none;z-index:30;transform:translate(-50%,-50%);animation:sparkFly 0.6s ease-out forwards}
@keyframes sparkFly{0%{opacity:1}100%{opacity:0;transform:translate(calc(-50% + var(--dx)),calc(-50% + var(--dy))) scale(0.3)}}
.confetti{position:absolute;width:9px;height:14px;border-radius:2px;pointer-events:none;z-index:20;top:-20px;animation:confFall linear forwards}
@keyframes confFall{0%{opacity:1;transform:translateY(0) rotate(0)}100%{opacity:0.9;transform:translateY(var(--fall)) rotate(var(--spin))}}
/* Responsive */
@media(max-width:400px){.swatch{width:30px;height:30px}#header h1{font-size:14px}.tool-btn{font-size:11px}}
</style>
</head>

// reconcilia desbloqueios a partir do que já foi concluído (sobrevive a mudanças no catálogo)
DRAWINGS.forEach((d, i) => { if(completed[d.id] && i + 1 < DRAWINGS.length) unlocked[i + 1] = true; });

// ─── AUDIO ───────────────────────────────────────────────────────────────────
function initAudio(){ if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)(); }
function playPaintSound(){
  if(!soundOn) return;
  try {
    initAudio();
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.frequency.value = 350 + Math.random() * 250;
    osc.type = 'sine';
    gain.gain.setValueAtTime(0.07, audioCtx.currentTime);
    gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.35);
    osc.start(); osc.stop(audioCtx.currentTime + 0.35);
  } catch(e){}
}
function playCompleteSound(){
  if(!soundOn) return;
  try {
    initAudio();
    [523,659,784,1047].forEach((f,i)=>{
      const osc=audioCtx.createOscillator(), gain=audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.type='sine'; osc.frequency.value=f;
      const t=audioCtx.currentTime+i*0.12;
      gain.gain.setValueAtTime(0.0001,t);
      gain.gain.exponentialRampToValueAtTime(0.12,t+0.03);
      gain.gain.exponentialRampToValueAtTime(0.001,t+0.4);
      osc.start(t); osc.stop(t+0.4);
    });
  } catch(e){}
}
function startAmbient(){
  if(!soundOn || ambientNodes.length) return;
  try {
    initAudio();
    const master = audioCtx.createGain();
    master.gain.value = 0.025; master.connect(audioCtx.destination);
    [55, 110, 165, 220, 275].forEach(freq => {
      const osc = audioCtx.createOscillator();
      osc.type = 'sine'; osc.frequency.value = freq;
      osc.connect(master); osc.start(); ambientNodes.push(osc);
    });
    ambientNodes.push(master);
  } catch(e){}
}
function stopAmbient(){
  ambientNodes.forEach(n => { try { n.stop ? n.stop() : n.disconnect(); } catch(e){} });
  ambientNodes = [];
}
function toggleSound(){
  soundOn = !soundOn;
  document.getElementById('sound-btn').textContent = soundOn ? '♪ Som: ON' : '♪ Som: OFF';
  if(soundOn){ initAudio(); startAmbient(); } else stopAmbient();
}

// ─── UI BUILDERS ─────────────────────────────────────────────────────────────
function buildPalette(){
  const row = document.getElementById('palette-row');
  row.innerHTML = '';
  PALETTES[colorMode].forEach(c => {
    const s = document.createElement('div');
    s.className = 'swatch' + (c === selectedColor ? ' selected' : '');
    s.style.background = c;
    s.dataset.color = c;
    s.title = c;
    s.addEventListener('click', () => selectColor(c));
    row.appendChild(s);
  });
}

function selectColor(c){
  selectedColor = c;
  document.querySelectorAll('.swatch').forEach(el => {
    el.classList.toggle('selected', el.dataset.color === c);
  });
}

function buildDrawingPicker(){
  const picker = document.getElementById('drawing-picker');
  picker.innerHTML = '';
  DRAWINGS.forEach((d, i) => {
    const btn = document.createElement('button');
    btn.className = 'draw-btn' + (i === currentDrawingIdx ? ' active' : '');
    btn.innerHTML = pickerLabel(i);
    btn.addEventListener('click', () => {
      if(!unlocked[i]){ showToast('Complete mais desenhos para desbloquear!'); return; }
      switchDrawing(i);
    });
    picker.appendChild(btn);
  });
}
function pickerLabel(i){
  const lock = unlocked[i] ? '' : '🔒 ';
  const tick = completed[DRAWINGS[i].id] ? '<span class="done-tick">✓</span>' : '';
  return lock + DRAWINGS[i].name + tick;
}
function updatePicker(){
  document.querySelectorAll('.draw-btn').forEach((b, i) => {
    b.className = 'draw-btn' + (i === currentDrawingIdx ? ' active' : '');
    b.innerHTML = pickerLabel(i);
  });
}

function switchDrawing(i){
  currentDrawingIdx = i;
  paintHistory = [];
  renderDrawing();
  updatePicker();
}

// ─── DRAWING ─────────────────────────────────────────────────────────────────
function renderDrawing(){
  const svg = document.getElementById('drawing-svg');
  const drawing = DRAWINGS[currentDrawingIdx];
  svg.innerHTML = '';
  // a arte salva deste desenho é a fonte das cores (referência viva em allArt)
  regionColors = allArt[drawing.id] || (allArt[drawing.id] = {});
  const regions = drawing.regions;
  totalAreas = regions.length;
  paintedCount = Object.keys(regionColors).length;

  regions.forEach(r => {
    const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    path.setAttribute('d', r.d);
    path.setAttribute('fill', regionColors[r.id] !== undefined ? regionColors[r.id] : r.fill);
    path.setAttribute('class', 'region' + (regionColors[r.id] !== undefined ? ' painted' : ''));
    path.dataset.id = r.id;
    path.addEventListener('click', (ev) => onRegionClick(r.id, path, ev));
    svg.appendChild(path);
  });

  updateProgress();
  document.getElementById('complete-msg').classList.remove('show');
}

function onRegionClick(id, path, ev){
  if(eyedropOn){
    selectColor(path.getAttribute('fill'));
    setEyedrop(false);
    showToast('Cor capturada! 💧');
    return;
  }
  paintRegion(id, path, ev);
}

function paintRegion(id, path, ev){
  const prevColor = path.getAttribute('fill');
  const defaultColor = DRAWINGS[currentDrawingIdx].regions.find(r => r.id === id).fill;
  if(prevColor === selectedColor) return; // já está nessa cor

  pushHistory([{ id, prevColor, wasDefault: prevColor === defaultColor }]);

  applyColor(path, id, selectedColor, true);
  playPaintSound();
  if(ev) sparkle(ev.clientX, ev.clientY, selectedColor);

  paintedCount = Object.keys(regionColors).length;
  updateProgress();
  persist();

  if(paintedCount >= totalAreas) setTimeout(completeDrawing, 450);
}

function applyColor(path, id, color, animate){
  path.setAttribute('fill', color);
  path.setAttribute('class', 'region painted' + (animate ? ' glow-anim' : ''));
  regionColors[id] = color;
  if(animate) setTimeout(() => path.setAttribute('class', 'region painted'), 700);
}

function pushHistory(items){
  paintHistory.push(items);
  if(paintHistory.length > 80) paintHistory.shift();
}

// ─── FERRAMENTAS ───────────────────────────────────────────────────────────────
function bucketFill(){
  const svg = document.getElementById('drawing-svg');
  const drawing = DRAWINGS[currentDrawingIdx];
  const batch = [];
  drawing.regions.forEach(r => {
    const path = svg.querySelector(`[data-id="${r.id}"]`);
    const prevColor = path.getAttribute('fill');
    if(prevColor === selectedColor) return;
    batch.push({ id:r.id, prevColor, wasDefault: prevColor === r.fill });
    applyColor(path, r.id, selectedColor, false);
  });
  if(!batch.length){ showToast('Tudo já está nessa cor!'); return; }
  pushHistory(batch);
  playPaintSound();
  paintedCount = Object.keys(regionColors).length;
  updateProgress();
  persist();
  if(paintedCount >= totalAreas) setTimeout(completeDrawing, 450);
}

function setEyedrop(on){
  eyedropOn = on;
  document.getElementById('eyedrop-btn').classList.toggle('active', on);
  document.getElementById('drawing-svg').classList.toggle('eyedrop', on);
}

function randomColor(){
  const pal = PALETTES[colorMode];
  const c = pal[Math.floor(Math.random()*pal.length)];
  selectColor(c);
  showToast('Cor surpresa! 🎲');
}

function undo(){
  if(!paintHistory.length) return;
  const batch = paintHistory.pop();
  const svg = document.getElementById('drawing-svg');
  // desfaz na ordem inversa
  for(let k = batch.length - 1; k >= 0; k--){
    const last = batch[k];
    const path = svg.querySelector(`[data-id="${last.id}"]`);
    if(!path) continue;
    if(last.wasDefault){
      const defaultColor = DRAWINGS[currentDrawingIdx].regions.find(r => r.id === last.id).fill;
      path.setAttribute('fill', defaultColor);
      path.setAttribute('class', 'region');
      delete regionColors[last.id];
    } else {
      path.setAttribute('fill', last.prevColor);
      path.setAttribute('class', 'region painted');
      regionColors[last.id] = last.prevColor;
    }
  }
  paintedCount = Object.keys(regionColors).length;
  updateProgress();
  persist();
}

function resetDrawing(){
  paintHistory = [];
  const id = DRAWINGS[currentDrawingIdx].id;
  allArt[id] = {};
  persist();
  renderDrawing();
}

// ─── EXPORTAR PNG ───────────────────────────────────────────────────────────────
function downloadPNG(){
  const svg = document.getElementById('drawing-svg');
  const ns = 'http://www.w3.org/2000/svg';
  const clone = svg.cloneNode(true);
  clone.setAttribute('xmlns', ns);
  clone.setAttribute('width', '600');
  clone.setAttribute('height', '600');
  // fundo
  const rect = document.createElementNS(ns, 'rect');
  rect.setAttribute('x','0'); rect.setAttribute('y','0');
  rect.setAttribute('width','300'); rect.setAttribute('height','300');
  rect.setAttribute('fill','#0f0f2e');
  clone.insertBefore(rect, clone.firstChild);
  // estilo (traços, já que vêm de CSS)
  const style = document.createElementNS(ns, 'style');
  style.textContent = '.region{stroke:#2a1f5c;stroke-width:1.5}.painted{stroke:#6d28d9;stroke-width:2}';
  clone.insertBefore(style, clone.firstChild);

  const data = new XMLSerializer().serializeToString(clone);
  const svgBlob = new Blob([data], { type:'image/svg+xml;charset=utf-8' });
  const url = URL.createObjectURL(svgBlob);
  const img = new Image();
  img.onload = () => {
    const canvas = document.createElement('canvas');
    canvas.width = 600; canvas.height = 600;
    const ctx = canvas.getContext('2d');
    ctx.drawImage(img, 0, 0, 600, 600);
    URL.revokeObjectURL(url);
    canvas.toBlob(blob => {
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'colorir-' + DRAWINGS[currentDrawingIdx].id + '.png';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(a.href), 1000);
    }, 'image/png');
    showToast('Imagem baixada! 💾');
  };
  img.onerror = () => { URL.revokeObjectURL(url); showToast('Não foi possível baixar 😕'); };
  img.src = url;
}

// ─── CONCLUSÃO ───────────────────────────────────────────────────────────────
function completeDrawing(){
  const drawing = DRAWINGS[currentDrawingIdx];
  const firstTime = !completed[drawing.id];
  const earned = drawing.xp;

  if(firstTime){
    completed[drawing.id] = true;
    totalXP += earned;
    // Conecta ao sistema de progresso/medalhas só na 1ª conclusão (flag draw = "Artista!").
    if (window.MAProgress) {
      MAProgress.recordGame({
        name: 'Colorir: ' + drawing.name, icon: '🖍️',
        xp: earned, flags: { draw: 1 }
      });
    }
  }

  document.getElementById('xp-reward-txt').textContent = firstTime
    ? `+${earned} XP ganhos! Total: ${totalXP} XP`
    : `Já concluído antes — sem XP extra. Total: ${totalXP} XP`;
  document.getElementById('complete-msg').classList.add('show');
  document.getElementById('xp-txt').textContent = totalXP + ' XP';

  playCompleteSound();
  confettiBurst();

  // desbloqueia o próximo
  const next = currentDrawingIdx + 1;
  if(next < DRAWINGS.length && !unlocked[next]){
    unlocked[next] = true;
    updatePicker();
    setTimeout(() => showToast('Novo desenho desbloqueado: ' + DRAWINGS[next].name + '! 🎉'), 900);
  }
  updatePicker();
  persist();
}

function updateProgress(){
  document.getElementById('progress-txt').textContent = `${paintedCount}/${totalAreas} áreas`;
  const pct = totalAreas > 0 ? (paintedCount / totalAreas) * 100 : 0;
  document.getElementById('xp-bar').style.width = Math.round(pct) + '%';
  document.getElementById('xp-txt').textContent = totalXP + ' XP';
}

function showToast(msg){
  const t = document.getElementById('unlock-toast');
  t.textContent = msg;
  t.classList.remove('show'); void t.offsetWidth; t.classList.add('show');
  clearTimeout(t._to);
  t._to = setTimeout(() => t.classList.remove('show'), 3000);
}

// ─── EFEITOS VISUAIS ───────────────────────────────────────────────────────────
function sparkle(clientX, clientY, color){
  const wrap = document.getElementById('canvas-wrap');
  const rect = wrap.getBoundingClientRect();
  const x = clientX - rect.left, y = clientY - rect.top;
  const n = 8;
  for(let i=0;i<n;i++){
    const s = document.createElement('div');
    s.className = 'spark';
    s.style.left = x+'px'; s.style.top = y+'px';
    s.style.background = i % 2 ? '#fff' : color;
    const ang = (Math.PI*2*i/n) + Math.random()*0.6;
    const dist = 18 + Math.random()*26;
    s.style.setProperty('--dx', Math.cos(ang)*dist+'px');
    s.style.setProperty('--dy', Math.sin(ang)*dist+'px');
    wrap.appendChild(s);
    setTimeout(()=>s.remove(), 620);
  }
}

function confettiBurst(){
  const host = document.getElementById('complete-msg');
  const colors = ['#ff6eb4','#ffd32a','#0be881','#54a0ff','#a55eea','#ff9f43','#00d2d3'];
  const w = host.clientWidth || 360;
  for(let i=0;i<46;i++){
    const c = document.createElement('div');
    c.className = 'confetti';
    c.style.left = (Math.random()*w) + 'px';
    c.style.background = colors[Math.floor(Math.random()*colors.length)];
    const dur = 1.6 + Math.random()*1.4;
    c.style.animationDuration = dur + 's';
    c.style.animationDelay = (Math.random()*0.4) + 's';
    c.style.setProperty('--fall', (host.clientHeight + 40) + 'px');
    c.style.setProperty('--spin', (Math.random()*720 - 360) + 'deg');
    host.appendChild(c);
    setTimeout(()=>c.remove(), (dur+0.6)*1000);
  }
}

// ─── EVENTS ──────────────────────────────────────────────────────────────────
document.getElementById('sound-btn').addEventListener('click', toggleSound);
document.getElementById('bucket-btn').addEventListener('click', bucketFill);
document.getElementById('eyedrop-btn').addEventListener('click', () => setEyedrop(!eyedropOn));
document.getElementById('random-btn').addEventListener('click', randomColor);
document.getElementById('undo-btn').addEventListener('click', undo);
document.getElementById('reset-btn').addEventListener('click', resetDrawing);
document.getElementById('download-btn').addEventListener('click', downloadPNG);
document.getElementById('save-png-btn').addEventListener('click', downloadPNG);

document.getElementById('next-draw-btn').addEventListener('click', () => {
  let next = (currentDrawingIdx + 1) % DRAWINGS.length;
  let tries = 0;
  while(!unlocked[next] && tries < DRAWINGS.length){ next = (next + 1) % DRAWINGS.length; tries++; }
  if(!unlocked[next]){ showToast('Ainda não há próximo disponível!'); return; }
  switchDrawing(next);
});

document.querySelectorAll('.mode-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    colorMode = btn.dataset.mode;
    document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    buildPalette();
  });
});

// ─── INIT ─────────────────────────────────────────────────────────────────────
buildPalette();
buildDrawingPicker();
renderDrawing();
</script>
