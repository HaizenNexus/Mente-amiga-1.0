<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Corrida do Foco</title>
<link rel="shortcut icon" href="../assets/favicon.ico" type="image/x-icon">
<style>
* { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
html,body {
  width:100%; height:100%;
  background:#06060f;
  display:flex; flex-direction:column; align-items:center; justify-content:flex-start;
  font-family: 'Segoe UI', system-ui, sans-serif;
  overflow:hidden;
}
#app {
  width:100%; max-width:440px; height:100vh;
  display:flex; flex-direction:column; align-items:center;
  position:relative; overflow:hidden;
  background: linear-gradient(180deg,#06060f 0%, #0c0c22 100%);
}
#hud {
  width:100%; display:flex; justify-content:space-between; align-items:center;
  padding:10px 18px 6px; z-index:10;
}
.hud-item { display:flex; flex-direction:column; align-items:center; gap:1px; }
.hud-label { font-size:9px; color:#44446a; letter-spacing:0.08em; text-transform:uppercase; font-weight:600; }
.hud-val { font-size:17px; font-weight:700; color:#c0c0ff; line-height:1; }
#xp-wrap { width:100%; padding:0 18px 5px; }
#xp-bg { background:#111130; border-radius:4px; height:4px; overflow:hidden; }
#xp-fill { height:4px; background:linear-gradient(90deg,#7c3aed,#06b6d4); border-radius:4px; width:0%; transition:width 0.5s ease; }
#canvas-area {
  width:100%; flex:1; position:relative; overflow:hidden;
  touch-action:none;
}
canvas { display:block; width:100%; height:100%; }
#overlay {
  position:absolute; inset:0;
  display:flex; flex-direction:column; align-items:center; justify-content:center;
  background:rgba(6,6,15,0.94);
  z-index:20; gap:12px; padding:16px;
  backdrop-filter:blur(4px);
  overflow-y:auto;
}
.ov-logo { font-size:42px; margin-bottom:2px; filter:drop-shadow(0 0 14px rgba(124,58,237,0.7)); }
.ov-title { font-size:26px; font-weight:800; color:#a78bfa; letter-spacing:0.05em; text-align:center; text-shadow:0 0 18px rgba(124,58,237,0.6); }
.ov-sub { font-size:13px; color:#5555aa; text-align:center; max-width:280px; line-height:1.5; }
.ov-score { font-size:22px; color:#06d6a0; font-weight:700; }
.ov-hi { font-size:13px; color:#7c3aed; font-weight:600; text-align:center; }
.ov-msg { font-size:15px; color:#a78bfa; font-weight:600; text-align:center; }
.btn {
  padding:13px 36px; border-radius:50px; border:none; cursor:pointer;
  font-size:15px; font-weight:700; letter-spacing:0.07em;
  background:linear-gradient(135deg,#7c3aed,#06b6d4);
  color:#fff; transition:transform 0.12s, opacity 0.15s;
  box-shadow: 0 0 24px rgba(124,58,237,0.5);
}
.btn:active { transform:scale(0.94); opacity:0.85; }
.btn.outline {
  background:transparent;
  border:1.5px solid #7c3aed;
  color:#a78bfa;
  box-shadow: 0 0 10px rgba(124,58,237,0.25);
}
/* ── Seletores (veículo / dificuldade) ── */
.sel-section { width:100%; max-width:340px; }
.sel-label { font-size:10px; color:#5e5e9a; letter-spacing:0.12em; text-transform:uppercase; font-weight:700; text-align:center; margin-bottom:7px; }
.sel-group { display:flex; gap:6px; justify-content:center; }
.sel-card {
  flex:1; cursor:pointer; padding:9px 2px 7px; border-radius:13px;
  background:rgba(20,20,46,0.7); border:1.5px solid #23234a;
  display:flex; flex-direction:column; align-items:center; gap:2px;
  transition:transform 0.12s, border-color 0.15s, box-shadow 0.2s;
}
.sel-card:active { transform:scale(0.95); }
.sel-card.active {
  border-color:#06b6d4;
  background:rgba(6,182,212,0.12);
  box-shadow:0 0 18px rgba(6,182,212,0.4);
}
.sc-emoji { font-size:24px; line-height:1; filter:drop-shadow(0 0 6px rgba(124,58,237,0.5)); }
.sc-name { font-size:11px; font-weight:700; color:#cdcdf5; }
.sc-desc { font-size:8.5px; color:#6a6aa0; text-align:center; line-height:1.2; }
.sel-card.active .sc-desc { color:#8fd6e8; }
#pu-msg {
  position:absolute; top:14px; left:50%; transform:translateX(-50%);
  background:rgba(124,58,237,0.9); color:#e8d8ff;
  padding:6px 20px; border-radius:24px; font-size:13px; font-weight:700;
  pointer-events:none; opacity:0; transition:opacity 0.3s;
  z-index:15; white-space:nowrap;
  box-shadow: 0 0 16px rgba(124,58,237,0.6);
}
#sound-btn {
  position:absolute; top:10px; right:16px; z-index:30;
  background:rgba(20,20,50,0.8); border:1px solid #2a2a5a; border-radius:20px;
  color:#6666aa; font-size:12px; padding:4px 12px; cursor:pointer;
}
#ctrl-hint {
  font-size:10px; color:#2a2a4a; text-align:center;
  padding:4px 0 6px; letter-spacing:0.04em;
}
#active-powers {
  position:absolute; bottom:12px; right:14px;
  display:flex; flex-direction:column; gap:4px;
  z-index:12; pointer-events:none;
}
.pw-badge {
  font-size:11px; font-weight:700; padding:3px 10px; border-radius:12px;
  color:#fff; opacity:0.9;
}
</style>
</head>
<body>
<div id="app">
  <button id="sound-btn">🔊 Som</button>
  <div id="hud">
    <div class="hud-item"><span class="hud-label">Pontos</span><span class="hud-val" id="score-v">0</span></div>
    <div class="hud-item"><span class="hud-label">Nível</span><span class="hud-val" id="level-v">1</span></div>
    <div class="hud-item"><span class="hud-label">Recorde</span><span class="hud-val" id="hi-v">0</span></div>
    <div class="hud-item"><span class="hud-label">Vidas</span><span class="hud-val" id="lives-v">❤❤❤</span></div>
  </div>
  <div id="xp-wrap"><div id="xp-bg"><div id="xp-fill"></div></div></div>
  <div id="canvas-area">
    <canvas id="c"></canvas>
    <div id="pu-msg"></div>
    <div id="active-powers"></div>
    <div id="overlay"></div>
  </div>
  <div id="ctrl-hint">← → Teclado &nbsp;|&nbsp; Toque nos lados ou arraste</div>
</div>

<script>
(function(){

/* ── Audio: efeitos ── */
let soundOn = true;
document.getElementById('sound-btn').onclick = function(){
  soundOn = !soundOn;
  this.textContent = soundOn ? '🔊 Som' : '🔇 Mudo';
  if(soundOn && musicCtx){ try{ musicCtx.resume(); }catch(e){} }
};
function playTone(type){
  if(!soundOn) return;
  try{
    const ac = new (window.AudioContext||window.webkitAudioContext)();
    const o=ac.createOscillator(), g=ac.createGain();
    o.connect(g); g.connect(ac.destination);
    const t=ac.currentTime;
    if(type==='collect'){ o.type='sine'; o.frequency.value=880; g.gain.setValueAtTime(0.12,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.2); }
    else if(type==='hit'){ o.type='sawtooth'; o.frequency.value=180; g.gain.setValueAtTime(0.15,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.25); }
    else if(type==='die'){ o.type='square'; o.frequency.setValueAtTime(220,t); o.frequency.exponentialRampToValueAtTime(60,t+0.5); g.gain.setValueAtTime(0.18,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.5); }
    else if(type==='levelup'){ o.type='sine'; o.frequency.setValueAtTime(440,t); o.frequency.setValueAtTime(880,t+0.12); g.gain.setValueAtTime(0.12,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.3); }
    else if(type==='select'){ o.type='triangle'; o.frequency.value=660; g.gain.setValueAtTime(0.07,t); g.gain.exponentialRampToValueAtTime(0.001,t+0.12); }
    o.start(t); o.stop(t+0.6);
  }catch(e){}
}

/* ── Audio: música de fundo (procedural, em loop) ── */
let musicCtx=null, musicTimer=null, musicStep=0;
const MEL=[0,3,5,7,10,7,5,3,0,5,10,12];
function startMusic(){
  if(musicCtx){ try{ musicCtx.resume(); }catch(e){} return; }
  try{ musicCtx=new (window.AudioContext||window.webkitAudioContext)(); }catch(e){ return; }
  const tick=()=>{
    if(!musicCtx) return;
    if(soundOn){
      try{
        const base=196; // Sol grave
        const f=base*Math.pow(2,MEL[musicStep%MEL.length]/12);
        const t=musicCtx.currentTime;
        const o=musicCtx.createOscillator(), g=musicCtx.createGain();
        o.type='triangle'; o.frequency.value=f; o.connect(g); g.connect(musicCtx.destination);
        g.gain.setValueAtTime(0.0001,t); g.gain.linearRampToValueAtTime(0.045,t+0.02); g.gain.exponentialRampToValueAtTime(0.0008,t+0.32);
        o.start(t); o.stop(t+0.36);
        if(musicStep%2===0){
          const ob=musicCtx.createOscillator(), gb=musicCtx.createGain();
          ob.type='sine'; ob.frequency.value=f/2; ob.connect(gb); gb.connect(musicCtx.destination);
          gb.gain.setValueAtTime(0.0001,t); gb.gain.linearRampToValueAtTime(0.05,t+0.02); gb.gain.exponentialRampToValueAtTime(0.0008,t+0.5);
          ob.start(t); ob.stop(t+0.55);
        }
      }catch(e){}
    }
    musicStep++;
    musicTimer=setTimeout(tick,300);
  };
  tick();
}

/* ── Canvas setup ── */
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
let W, H;

function resize(){
  const area = document.getElementById('canvas-area');
  W = area.clientWidth; H = area.clientHeight;
  canvas.width = W; canvas.height = H;
  initAmbient(); initPosts();
}

/* ── Configurações: dificuldade e veículos ── */
const DIFFS = {
  facil:   { label:'Fácil',   desc:'Calmo',      baseSpeed:2.2, lives:5, spawnBase:120, spawnLevel:5, spawnMin:46, puRate:200, color:'#34d399' },
  medio:   { label:'Médio',   desc:'Equilibrado',baseSpeed:2.9, lives:3, spawnBase:95,  spawnLevel:7, spawnMin:38, puRate:260, color:'#fbbf24' },
  dificil: { label:'Difícil', desc:'Intenso',    baseSpeed:3.7, lives:2, spawnBase:78,  spawnLevel:9, spawnMin:30, puRate:330, color:'#f72585' }
};
const VEHICLES = {
  carro: { label:'Carro', emoji:'🏎️', desc:'Estrada',  hitMul:1.0,  ease:0.20, color:'#06d6a0', glow:'#00ffcc' },
  moto:  { label:'Moto',  emoji:'🏍️', desc:'Cidade',   hitMul:0.70, ease:0.30, color:'#f59e0b', glow:'#fbbf24' },
  aviao: { label:'Avião', emoji:'✈️', desc:'Céu',      hitMul:0.92, ease:0.16, color:'#60a5fa', glow:'#38bdf8' },
  barco: { label:'Barco', emoji:'🚤', desc:'Mar',      hitMul:1.05, ease:0.16, color:'#38bdf8', glow:'#22d3ee' }
};
/* ── Cenário (tema) por veículo ── */
const THEMES = {
  carro: { type:'night', surf:'road', g0:'#0a0a1f', g1:'#05050f', r0:'#0c0c24', r1:'#15153c', edge:'#7c3aed', edge2:'#06b6d4', dash:'#2a2a55', obstacles:['car','barrier','cone'] },
  moto:  { type:'city',  surf:'road', g0:'#ff8c5a', g1:'#180e2c', r0:'#241433', r1:'#3a1d33', edge:'#fb7185', edge2:'#fbbf24', dash:'#5a3a4a', obstacles:['car','barrier','oil'] },
  aviao: { type:'day',   surf:'sky',  g0:'#2f7fd0', g1:'#a8daf7', r0:'',        r1:'',        edge:'#ffffff', edge2:'#bae6fd', dash:'#e0f2ff', obstacles:['bird','plane','heli'] },
  barco: { type:'sea',   surf:'sea',  g0:'#0e4f8a', g1:'#062a4d', r0:'',        r1:'',        edge:'#bae6fd', edge2:'#ffffff', dash:'#bfeaff', obstacles:['buoy','rock','boat'] }
};
function theme(){ return THEMES[selVehicle]; }

/* ── Game state ── */
let state='menu', raf=null;
let score, xp, level, lives, frame;
let selVehicle='carro', selDiff='medio';
let diff=DIFFS[selDiff], veh=VEHICLES[selVehicle];
let playerX, playerLane, playerTargetX, playerY, playerYTarget;
let speed, baseSpeed;
let shield, slowTimer, turboTimer, multTimer;
let obstacles, powerups, particles, roadY;
let ambient=[], posts=[], buildings=[];
let invincibleFrames=0, shake=0;
let puTimeout=null;
let curEff=2.8;

const ov=document.getElementById('overlay');

function hiKey(){ return 'focusRaceHi_'+selVehicle+'_'+selDiff; }
function getHi(){ return parseInt(localStorage.getItem(hiKey())||'0'); }
let hi = getHi();
document.getElementById('hi-v').textContent = hi;

/* ── Layout ── */
function getLanes(){ return [W*.27, W*.5, W*.73]; }
const ROAD_L = ()=>W*.16, ROAD_R = ()=>W*.84;
const ALT_MIN = ()=>H*0.32, ALT_MAX = ()=>H-70;

/* ── Helpers ── */
function shade(hex,amt){
  let c=hex.replace('#',''); if(c.length===3)c=c.split('').map(x=>x+x).join('');
  const r=Math.max(0,Math.min(255,parseInt(c.slice(0,2),16)+amt));
  const g=Math.max(0,Math.min(255,parseInt(c.slice(2,4),16)+amt));
  const b=Math.max(0,Math.min(255,parseInt(c.slice(4,6),16)+amt));
  return 'rgb('+r+','+g+','+b+')';
}
function roundRectPath(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

/* ── Ambient (fundo) por tema ── */
function initAmbient(){
  ambient=[]; buildings=[];
  const ty=theme().type;
  if(ty==='night'){
    for(let i=0;i<80;i++) ambient.push({x:Math.random()*W,y:Math.random()*H,z:Math.random()*0.7+0.3,r:Math.random()*1.4+0.4});
  } else if(ty==='city'){
    for(let i=0;i<40;i++) ambient.push({x:Math.random()*W,y:Math.random()*H,z:Math.random()*0.6+0.4,r:Math.random()*2+1});
    initBuildings();
  } else if(ty==='day'){
    for(let i=0;i<11;i++) ambient.push({x:Math.random()*W,y:Math.random()*H*1.2-H*0.1,z:Math.random()*0.6+0.4,s:0.6+Math.random()*1.0});
  } else { // sea
    for(let i=0;i<40;i++) ambient.push({x:Math.random()*W,y:Math.random()*H,z:Math.random()*0.6+0.4,len:18+Math.random()*32});
  }
}
function initBuildings(){
  for(let side=0;side<2;side++){
    let y=-Math.random()*200;
    for(let i=0;i<7;i++){
      const h=45+Math.random()*95;
      buildings.push({side,y,h,w:20+Math.random()*18});
      y-=h+14+Math.random()*22;
    }
  }
}
function initPosts(){
  posts=[];
  for(let i=0;i<8;i++) posts.push(i*(H/4));
}

/* ── Init ── */
function init(){
  cancelAnimationFrame(raf);
  resize();
  diff=DIFFS[selDiff]; veh=VEHICLES[selVehicle];
  hi=getHi();
  state='playing';
  score=0; xp=0; level=1; lives=diff.lives; frame=0;
  playerLane=1; playerX=getLanes()[1]; playerTargetX=playerX;
  playerY=playerYTarget=H-85;
  speed=baseSpeed=diff.baseSpeed;
  shield=false; slowTimer=0; turboTimer=0; multTimer=0; invincibleFrames=0; shake=0;
  obstacles=[]; powerups=[]; particles=[];
  roadY=Array.from({length:10},(_,i)=>i*(H/10));
  document.getElementById('ctrl-hint').innerHTML = selVehicle==='aviao'
    ? '← → faixa &nbsp;|&nbsp; ↑ ↓ altitude &nbsp;|&nbsp; ou arraste'
    : '← → Teclado &nbsp;|&nbsp; Toque nos lados ou arraste';
  ov.style.display='none';
  startMusic();
  updateHUD(); loop();
}

/* ── HUD ── */
function updateHUD(){
  document.getElementById('score-v').textContent=score;
  document.getElementById('level-v').textContent=level;
  document.getElementById('hi-v').textContent=hi;
  document.getElementById('lives-v').textContent=lives>0?'❤'.repeat(lives):'💀';
  document.getElementById('xp-fill').style.width=Math.min(100,(xp%(level*100))/(level*100)*100)+'%';
  const pw=document.getElementById('active-powers'); pw.innerHTML='';
  if(shield) pw.innerHTML+='<div class="pw-badge" style="background:#0e7490">🛡 Escudo</div>';
  if(slowTimer>0) pw.innerHTML+='<div class="pw-badge" style="background:#5b21b6">⏱ Slow</div>';
  if(turboTimer>0) pw.innerHTML+='<div class="pw-badge" style="background:#b45309">⚡ Turbo</div>';
  if(multTimer>0) pw.innerHTML+='<div class="pw-badge" style="background:#065f46">💎 x2 XP</div>';
}

/* ── Power-up message ── */
function showPU(msg,col){
  const el=document.getElementById('pu-msg');
  el.textContent=msg; el.style.background=col+'dd'; el.style.opacity='1';
  if(puTimeout) clearTimeout(puTimeout);
  puTimeout=setTimeout(()=>el.style.opacity='0',1900);
}

/* ── Cloud helper ── */
function drawCloud(x,y,s,a){
  ctx.save(); ctx.globalAlpha=a; ctx.fillStyle='#ffffff';
  ctx.beginPath();
  ctx.arc(x,y,14*s,0,7);
  ctx.arc(x+16*s,y+4*s,11*s,0,7);
  ctx.arc(x-16*s,y+4*s,11*s,0,7);
  ctx.arc(x,y+6*s,16*s,0,7);
  ctx.fill();
  ctx.globalAlpha=a*0.5; ctx.fillStyle='#cfe8ff';
  ctx.beginPath(); ctx.arc(x,y+9*s,15*s,0,Math.PI); ctx.fill();
  ctx.restore();
}
function drawBuildings(){
  const l=ROAD_L(), r=ROAD_R();
  buildings.forEach(b=>{
    b.y+=curEff*0.85;
    if(b.y>H+8){ b.y=-b.h-Math.random()*60; b.w=20+Math.random()*18; }
    const bx = b.side===0 ? (l-7-b.w) : (r+7);
    ctx.fillStyle='#2a1838';
    ctx.fillRect(bx,b.y,b.w,b.h);
    ctx.fillStyle='rgba(0,0,0,0.3)'; ctx.fillRect(bx,b.y,3,b.h);
    ctx.fillStyle='rgba(255,196,110,0.5)';
    for(let wy=b.y+7; wy<b.y+b.h-4; wy+=11){
      for(let wx=bx+4; wx<bx+b.w-4; wx+=9){ ctx.fillRect(wx,wy,4,5); }
    }
  });
}

/* ── Drawing: sky/background por tema ── */
function drawSky(){
  const th=theme();
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,th.g0); g.addColorStop(1,th.g1);
  ctx.fillStyle=g; ctx.fillRect(-30,-30,W+60,H+60);

  if(th.type==='night'){
    ambient.forEach(s=>{
      s.y+=curEff*s.z*0.55; if(s.y>H){ s.y=-2; s.x=Math.random()*W; }
      ctx.globalAlpha=s.z; ctx.fillStyle= s.z>0.75?'#bcd0ff':'#5a5a8a';
      ctx.fillRect(s.x,s.y,s.r,s.r*2.2);
    });
    ctx.globalAlpha=1;
  } else if(th.type==='city'){
    const sg=ctx.createRadialGradient(W/2,H*0.05,4,W/2,H*0.05,W*0.7);
    sg.addColorStop(0,'rgba(255,210,120,0.5)'); sg.addColorStop(1,'rgba(255,120,80,0)');
    ctx.fillStyle=sg; ctx.fillRect(0,0,W,H*0.5);
    ctx.fillStyle='#ffd27a';
    ctx.beginPath(); ctx.arc(W/2,H*0.07,28,0,7); ctx.fill();
    drawBuildings();
    ambient.forEach(s=>{
      s.y+=curEff*s.z*0.5; s.x+=Math.sin(s.y*0.04)*0.3;
      if(s.y>H){ s.y=-2; s.x=Math.random()*W; }
      ctx.globalAlpha=s.z*0.55; ctx.fillStyle='#ffb15e';
      ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,7); ctx.fill();
    });
    ctx.globalAlpha=1;
  } else if(th.type==='day'){
    ctx.save();
    ctx.shadowColor='#fff7c0'; ctx.shadowBlur=45; ctx.fillStyle='#fff7c0';
    ctx.beginPath(); ctx.arc(W*0.8,H*0.12,24,0,7); ctx.fill();
    ctx.restore();
    ambient.forEach(c=>{
      c.y+=curEff*c.z*0.55; if(c.y>H+34){ c.y=-34; c.x=Math.random()*W; }
      drawCloud(c.x,c.y,c.s,0.9);
    });
  } else { // sea
    ctx.strokeStyle='#ffffff'; ctx.lineWidth=2;
    ambient.forEach(s=>{
      s.y+=curEff*s.z*0.85; if(s.y>H){ s.y=-4; s.x=Math.random()*W; }
      ctx.globalAlpha=s.z*0.4;
      ctx.beginPath(); ctx.moveTo(s.x,s.y); ctx.quadraticCurveTo(s.x+s.len/2,s.y-3,s.x+s.len,s.y); ctx.stroke();
    });
    ctx.globalAlpha=1;
  }
}

/* ── Drawing: pista/corredor por tema ── */
function wavyLine(x){
  ctx.beginPath();
  for(let y=-4;y<=H+4;y+=8){
    const xx=x+Math.sin((y+frame*2)*0.05)*3;
    if(y<=-4) ctx.moveTo(xx,y); else ctx.lineTo(xx,y);
  }
  ctx.stroke();
}
function drawTrack(){
  const th=theme(); const l=ROAD_L(),r=ROAD_R(),rw=r-l, laneW=rw/3;
  if(th.surf==='road'){
    const g=ctx.createLinearGradient(l,0,r,0);
    g.addColorStop(0,th.r0); g.addColorStop(0.5,th.r1); g.addColorStop(1,th.r0);
    ctx.fillStyle=g; ctx.fillRect(l,0,rw,H);
    ctx.save();
    posts.forEach((y,i)=>{
      posts[i]+=curEff*1.5; if(posts[i]>H+10) posts[i]-=(H+20);
      const col=i%2?th.edge2:th.edge;
      ctx.shadowColor=col; ctx.shadowBlur=12; ctx.fillStyle=col;
      ctx.fillRect(l-7,posts[i],4,16); ctx.fillRect(r+3,posts[i],4,16);
    });
    ctx.restore();
    ctx.save();
    ctx.shadowColor=th.edge; ctx.shadowBlur=16; ctx.strokeStyle=th.edge+'88'; ctx.lineWidth=3;
    ctx.beginPath(); ctx.moveTo(l,0); ctx.lineTo(l,H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(r,0); ctx.lineTo(r,H); ctx.stroke();
    ctx.restore();
    ctx.setLineDash([26,18]); ctx.strokeStyle=th.dash; ctx.lineWidth=2.5;
    [1,2].forEach(i=>{ const x=l+laneW*i; roadY.forEach(y=>{ ctx.beginPath(); ctx.moveTo(x,y); ctx.lineTo(x,y+26); ctx.stroke(); }); });
    ctx.setLineDash([]);
  } else if(th.surf==='sky'){
    ctx.fillStyle='rgba(255,255,255,0.06)'; ctx.fillRect(l,0,rw,H);
    ctx.setLineDash([14,22]);
    ctx.strokeStyle='rgba(255,255,255,0.55)'; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(l,0); ctx.lineTo(l,H); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(r,0); ctx.lineTo(r,H); ctx.stroke();
    ctx.strokeStyle='rgba(255,255,255,0.3)';
    [1,2].forEach(i=>{ const x=l+laneW*i; ctx.beginPath(); roadY.forEach(y=>{ ctx.moveTo(x,y); ctx.lineTo(x,y+14); }); ctx.stroke(); });
    ctx.setLineDash([]);
  } else { // sea
    ctx.fillStyle='rgba(255,255,255,0.05)'; ctx.fillRect(l,0,rw,H);
    ctx.strokeStyle='rgba(255,255,255,0.5)'; ctx.lineWidth=2.5;
    wavyLine(l); wavyLine(r);
    ctx.strokeStyle='rgba(255,255,255,0.22)'; ctx.lineWidth=2;
    wavyLine(l+laneW); wavyLine(l+laneW*2);
  }
}

/* ── Drawing: veículos do jogador ── */
function drawCarV(x,y,color,glow,s){
  const w=30*s,h=48*s;
  ctx.save();
  ctx.shadowColor=glow; ctx.shadowBlur=16*s;
  ctx.fillStyle='#15151f';
  roundRectPath(x-w/2-2,y-h*0.30,6,12,2); ctx.fill();
  roundRectPath(x+w/2-4,y-h*0.30,6,12,2); ctx.fill();
  roundRectPath(x-w/2-2,y+h*0.12,6,12,2); ctx.fill();
  roundRectPath(x+w/2-4,y+h*0.12,6,12,2); ctx.fill();
  const g=ctx.createLinearGradient(x-w/2,0,x+w/2,0);
  g.addColorStop(0,shade(color,-45)); g.addColorStop(0.5,color); g.addColorStop(1,shade(color,-45));
  ctx.fillStyle=g;
  ctx.beginPath();
  ctx.moveTo(x,y-h/2);
  ctx.bezierCurveTo(x+w/2,y-h/2+h*0.18, x+w/2,y+h/2-h*0.16, x,y+h/2);
  ctx.bezierCurveTo(x-w/2,y+h/2-h*0.16, x-w/2,y-h/2+h*0.18, x,y-h/2);
  ctx.fill();
  ctx.fillStyle=shade(color,-60);
  roundRectPath(x-w*0.42,y+h*0.30,w*0.84,5,2); ctx.fill();
  ctx.shadowBlur=0;
  const wg=ctx.createLinearGradient(0,y-h*0.22,0,y+h*0.05);
  wg.addColorStop(0,'rgba(180,255,240,0.45)'); wg.addColorStop(1,'rgba(0,200,200,0.12)');
  ctx.fillStyle=wg;
  roundRectPath(x-w*0.27,y-h*0.20,w*0.54,h*0.26,4); ctx.fill();
  ctx.fillStyle='#fff8d0'; ctx.shadowColor='#fff8d0'; ctx.shadowBlur=10;
  ctx.beginPath(); ctx.arc(x-w*0.28,y-h*0.44,2.4,0,7); ctx.fill();
  ctx.beginPath(); ctx.arc(x+w*0.28,y-h*0.44,2.4,0,7); ctx.fill();
  ctx.restore();
}

function drawPlaneV(x,y,color,glow,s){

function drawBoatV(x,y,color,glow,s){

/* ── Spawn ── */
const OBS_COLORS=['#f72585','#ff6b35','#ffd60a','#ef4444','#a855f7'];
const PU_DEFS={
  shield:{col:'#06b6d4',glyph:'🛡'},
  slow:{col:'#a78bfa',glyph:'⏱'},
  turbo:{col:'#fbbf24',glyph:'⚡'},
  multi:{col:'#34d399',glyph:'💎'}
};
function obsColor(shape){
  if(shape==='bird') return ['#1e293b','#334155','#0f172a'][Math.floor(Math.random()*3)];
  if(shape==='heli') return ['#ef4444','#22c55e','#eab308'][Math.floor(Math.random()*3)];
  if(shape==='plane') return ['#94a3b8','#cbd5e1','#e11d48'][Math.floor(Math.random()*3)];
  if(shape==='boat') return ['#cbd5e1','#f59e0b','#a855f7'][Math.floor(Math.random()*3)];
  if(shape==='oil') return '#0a0a14';
  if(shape==='rock') return '#64748b';
  if(shape==='buoy') return '#ef4444';
  return OBS_COLORS[Math.floor(Math.random()*OBS_COLORS.length)];
}
function spawnObs(){
  const li=Math.floor(Math.random()*3);
  const list=theme().obstacles;
  const shape=list[Math.floor(Math.random()*list.length)];

function spawnPU(){
  const keys=Object.keys(PU_DEFS);
  const kind=keys[Math.floor(Math.random()*keys.length)];

/* ── Explosion ── */
function explode(x,y,color,n=20){
  const cols=['#f72585','#7c3aed','#06d6a0','#fbbf24',color];
  for(let i=0;i<n;i++){
    const a=Math.random()*Math.PI*2, s=1.5+Math.random()*4;
    particles.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,r:2+Math.random()*4,life:1,color:cols[Math.floor(Math.random()*cols.length)]});
  }
}

/* ── Collision ── */
function hit(ax,ay,bx,by,r){ return Math.hypot(ax-bx,ay-by)<r; }

/* ── Main loop ── */
function loop(){
  if(state!=='playing') return;
  frame++;
  const eff=slowTimer>0?speed*0.42:(turboTimer>0?speed*1.75:speed);
  curEff=eff;

  roadY.forEach((y,i)=>{ roadY[i]+=eff*1.3; if(roadY[i]>H) roadY[i]-=H; });

  const sr=Math.max(diff.spawnMin, diff.spawnBase-level*diff.spawnLevel);
  if(frame%sr===0) spawnObs();
  if(frame%(diff.puRate-Math.min(level*10,150))===0) spawnPU();

  score+=(turboTimer>0?2:1);
  xp+=(multTimer>0?2:1);

  const xpNeed=level*100;
  if(xp>=xpNeed){ level++; baseSpeed+=0.22; xp=0; playTone('levelup'); showPU('Nível '+level+'! 🚀','#7c3aed'); }
  speed=baseSpeed;

  if(slowTimer>0) slowTimer--;
  if(turboTimer>0) turboTimer--;
  if(multTimer>0) multTimer--;
  if(invincibleFrames>0) invincibleFrames--;

  const obsSpd=slowTimer>0?0.42:1;
  obstacles.forEach(o=>{ o.y+=o.spd*obsSpd; });
  obstacles=obstacles.filter(o=>o.y<H+50);
  powerups.forEach(p=>{ p.y+=p.spd; });
  powerups=powerups.filter(p=>p.y<H+40);
  particles.forEach(p=>{ p.x+=p.vx; p.y+=p.vy; p.vy+=0.1; p.life-=0.04; });
  particles=particles.filter(p=>p.life>0);

  playerX+=(playerTargetX-playerX)*veh.ease;
  if(selVehicle==='aviao') playerY+=(playerYTarget-playerY)*0.2;
  const py=playerY;

  if(invincibleFrames===0){
    for(let i=obstacles.length-1;i>=0;i--){
      const o=obstacles[i];
      const r=obsRadius(o.shape)*veh.hitMul;
      if(hit(playerX,py,o.x,o.y,r)){
        explode(o.x,o.y,o.color);
        obstacles.splice(i,1);
        shake=12;
        if(shield){ shield=false; showPU('Escudo quebrou!','#06b6d4'); playTone('hit'); }
        else{
          lives--; playTone(lives>0?'hit':'die');
          invincibleFrames=90;
          updateHUD();
          if(lives<=0){ gameOver(); return; }
        }
        break;
      }
    }
  }

  for(let i=powerups.length-1;i>=0;i--){
    const p=powerups[i];
    if(hit(playerX,py,p.x,p.y,30)){
      explode(p.x,p.y,p.col,14);
      powerups.splice(i,1); playTone('collect');
      if(p.kind==='shield'){ shield=true; showPU('🛡 Escudo ativo!',PU_DEFS.shield.col); }
      else if(p.kind==='slow'){ slowTimer=230; showPU('⏱ Câmera lenta!',PU_DEFS.slow.col); }
      else if(p.kind==='turbo'){ turboTimer=190; showPU('⚡ Turbo!',PU_DEFS.turbo.col); }
      else if(p.kind==='multi'){ multTimer=210; showPU('💎 XP x2!',PU_DEFS.multi.col); }
    }
  }

  // Draw (com screen shake)
  ctx.save();
  if(shake>0){ ctx.translate((Math.random()-0.5)*shake,(Math.random()-0.5)*shake); shake*=0.85; if(shake<0.4)shake=0; }
  drawSky(); drawTrack();
  if(slowTimer>0){ ctx.fillStyle='rgba(167,139,250,0.05)'; ctx.fillRect(ROAD_L(),0,ROAD_R()-ROAD_L(),H); }
  if(turboTimer>0){ ctx.fillStyle='rgba(251,191,36,0.06)'; ctx.fillRect(ROAD_L(),0,ROAD_R()-ROAD_L(),H); }
  obstacles.forEach(o=>drawObstacle(o));
  powerups.forEach(p=>drawPowerup(p));
  drawParticles();
  drawSpeedLines();
  drawPlayer();
  ctx.restore();

  if(score>hi){ hi=score; localStorage.setItem(hiKey(),hi); }
  updateHUD();
  raf=requestAnimationFrame(loop);
}

/* ── Game Over ── */
function gameOver(){
  state='over';
  cancelAnimationFrame(raf);
  if(score>hi){ hi=score; }
  localStorage.setItem(hiKey(),hi);
  if (window.MAProgress) {
    MAProgress.recordGame({
      name: 'Corrida', icon: '🏎️',
      xp: MAProgress.clamp(Math.round(score / 3), 10, 200),
      score: score, flags: { race: score }
    });
  }
  const msgs=[
    [200,'🔥 Incrível! Reflexos afiados!'],
    [100,'👏 Muito bom! Continue assim!'],
    [50,'⭐ Bom começo! Pratique mais!'],
    [0,'🎯 Continue tentando, você melhora!']
  ];
  const msg=msgs.find(([t])=>score>=t)[1];
  ov.innerHTML=
    '<div class="ov-logo">💥</div>'+
    '<div class="ov-title">Game Over</div>'+
    '<div class="ov-score">Pontos: '+score+'</div>'+
    '<div class="ov-hi">🏆 Recorde ('+VEHICLES[selVehicle].emoji+' '+VEHICLES[selVehicle].label+' / '+diff.label+'): '+hi+'</div>'+
    '<div class="ov-msg">'+msg+'</div>'+
    '<button class="btn" id="retryBtn">🔄 Tentar Novamente</button>'+
    '<button class="btn outline" id="menuBtn">🏠 Menu</button>';
  ov.style.display='flex';
  document.getElementById('retryBtn').onclick=()=>init();
  document.getElementById('menuBtn').onclick=()=>showMenu();
}

/* ── Menu (seleção de veículo e dificuldade) ── */
function refreshMenuHi(){
  const el=document.getElementById('menu-hi');
  if(el) el.textContent='🏆 Recorde ('+VEHICLES[selVehicle].label+' / '+DIFFS[selDiff].label+'): '+getHi();
  document.getElementById('hi-v').textContent=getHi();
}
function showMenu(){
  state='menu';
  const vehCards=Object.keys(VEHICLES).map(k=>{
    const v=VEHICLES[k];
    return '<div class="sel-card'+(k===selVehicle?' active':'')+'" data-veh="'+k+'">'+
      '<div class="sc-emoji">'+v.emoji+'</div>'+
      '<div class="sc-name">'+v.label+'</div>'+
      '<div class="sc-desc">'+v.desc+'</div></div>';
  }).join('');
  const diffCards=Object.keys(DIFFS).map(k=>{
    const d=DIFFS[k];
    return '<div class="sel-card'+(k===selDiff?' active':'')+'" data-diff="'+k+'">'+
      '<div class="sc-name" style="color:'+d.color+';font-size:14px">'+d.label+'</div>'+
      '<div class="sc-desc">'+d.desc+'</div></div>';
  }).join('');
  ov.innerHTML=
    '<div class="ov-logo">🏁</div>'+
    '<div class="ov-title">Corrida do Foco</div>'+
    '<div class="ov-sub">Cada veículo tem seu próprio cenário! Desvie e colete power-ups.</div>'+
    '<div class="sel-section"><div class="sel-label">Veículo &amp; Cenário</div><div class="sel-group" id="veh-group">'+vehCards+'</div></div>'+
    '<div class="sel-section"><div class="sel-label">Dificuldade</div><div class="sel-group" id="diff-group">'+diffCards+'</div></div>'+
    '<div class="ov-hi" id="menu-hi"></div>'+
    '<button class="btn" id="startBtn">▶ Iniciar Corrida</button>';
  ov.style.display='flex';
  refreshMenuHi();

  ov.querySelectorAll('[data-veh]').forEach(el=>el.onclick=()=>{
    selVehicle=el.dataset.veh; playTone('select');
    ov.querySelectorAll('[data-veh]').forEach(c=>c.classList.toggle('active',c.dataset.veh===selVehicle));
    refreshMenuHi();
  });
  ov.querySelectorAll('[data-diff]').forEach(el=>el.onclick=()=>{
    selDiff=el.dataset.diff; playTone('select');
    ov.querySelectorAll('[data-diff]').forEach(c=>c.classList.toggle('active',c.dataset.diff===selDiff));
    refreshMenuHi();
  });
  document.getElementById('startBtn').onclick=()=>init();
}

/* ── Controls ── */
function moveLeft(){ if(playerLane>0){ playerLane--; playerTargetX=getLanes()[playerLane]; } }
function moveRight(){ if(playerLane<2){ playerLane++; playerTargetX=getLanes()[playerLane]; } }
function moveUp(){ if(selVehicle==='aviao'){ playerYTarget=Math.max(ALT_MIN(), playerYTarget-95); } }
function moveDown(){ if(selVehicle==='aviao'){ playerYTarget=Math.min(ALT_MAX(), playerYTarget+95); } }

document.addEventListener('keydown',e=>{
  if(state!=='playing') return;
  if(e.key==='ArrowLeft'||e.key==='a') moveLeft();
  else if(e.key==='ArrowRight'||e.key==='d') moveRight();
  else if(e.key==='ArrowUp'||e.key==='w') moveUp();
  else if(e.key==='ArrowDown'||e.key==='s') moveDown();
});

let touchX=null, touchY=null;
const ca=document.getElementById('canvas-area');
ca.addEventListener('touchstart',e=>{ touchX=e.touches[0].clientX; touchY=e.touches[0].clientY; },{passive:true});
ca.addEventListener('touchend',e=>{
  if(touchX===null||state!=='playing') return;
  const dx=e.changedTouches[0].clientX-touchX;
  const dy=e.changedTouches[0].clientY-touchY;
  if(selVehicle==='aviao' && Math.abs(dy)>Math.abs(dx) && Math.abs(dy)>22){
    dy<0?moveUp():moveDown();
  } else if(Math.abs(dx)>22){
    dx<0?moveLeft():moveRight();
  } else {
    const bnd=ca.getBoundingClientRect();
    e.changedTouches[0].clientX-bnd.left<bnd.width/2?moveLeft():moveRight();
  }
  touchX=null; touchY=null;
},{passive:true});

ca.addEventListener('click',e=>{
  if(state!=='playing') return;
  const bnd=ca.getBoundingClientRect();
  e.clientX-bnd.left<bnd.width/2?moveLeft():moveRight();
});

window.addEventListener('resize',()=>{
  resize();
  if(state==='playing'){
    const ls=getLanes();
    playerTargetX=ls[playerLane];
    obstacles.forEach(o=>o.x=getLanes()[o.lane]);
  }
});

resize();
showMenu();
})();
</script>
