<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jogo do Foco</title>
<link rel="shortcut icon" href="../assets/favicon/favicon.ico" type="image/x-icon">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/enhance.css" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg-deep:    #080812;
    --bg-mid:     #0d0d1e;
    --bg-card:    #11112a;
    --bg-raised:  #161635;
    --border:     rgba(120,100,255,0.15);
    --border-glow:rgba(120,100,255,0.35);
    --neon-purple:#9b8fff;
    --neon-teal:  #44d9b8;
    --neon-pink:  #e060a0;
    --neon-amber: #f0a840;
    --neon-blue:  #50b8ff;
    --text-1:     #ddd8ff;
    --text-2:     #8888b8;
    --text-3:     #50507a;
    --success:    #40c890;
    --danger:     #e05070;
    --font-main: 'Space Grotesk', system-ui, sans-serif;
    --font-mono: 'DM Mono', monospace;
  }

  html, body {
    background: var(--bg-deep);
    color: var(--text-1);
    font-family: var(--font-main);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 16px;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background:
      radial-gradient(ellipse 60% 40% at 20% 10%, rgba(100,80,220,0.12) 0%, transparent 60%),
      radial-gradient(ellipse 50% 35% at 80% 85%, rgba(40,180,140,0.09) 0%, transparent 60%);
    pointer-events: none;
    z-index: 0;
  }

  #app {
    position: relative;
    z-index: 1;
    width: 100%;
    max-width: 520px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 0;
  }

  /* ── HEADER ── */
  .header {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 0 16px;
  }
  .header-brand { display: flex; flex-direction: column; }
  .brand-name {
    font-size: 18px;
    font-weight: 700;
    color: var(--neon-purple);
    letter-spacing: 0.02em;
  }
  .brand-sub {
    font-size: 11px;
    color: var(--text-3);
    font-family: var(--font-mono);
    letter-spacing: 0.08em;
    margin-top: 1px;
  }
  .header-controls { display: flex; gap: 8px; align-items: center; }
  .record-pill {
    display: flex; align-items: center; gap: 5px;
    background: rgba(240,168,64,0.1);
    border: 1px solid rgba(240,168,64,0.28);
    border-radius: 8px;
    padding: 5px 10px;
    font-family: var(--font-mono);
    font-size: 11px;
    color: var(--neon-amber);
    white-space: nowrap;
  }
  .icon-btn {
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-2);
    border-radius: 8px;
    width: 34px;
    height: 34px;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    font-size: 14px;
    transition: border-color 0.2s, color 0.2s, background 0.2s;
  }
  .icon-btn:hover { border-color: var(--border-glow); color: var(--neon-purple); }
  .icon-btn.active { border-color: var(--neon-purple); color: var(--neon-purple); background: rgba(155,143,255,0.1); }

  /* ── LEVEL & XP ── */
  .level-row {
    width: 100%;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 14px;
  }
  .level-tag { font-family: var(--font-mono); font-size: 11px; color: var(--text-3); white-space: nowrap; }
  .level-tag span { color: var(--neon-purple); font-weight: 500; }
  .xp-track {
    flex: 1; height: 5px; background: var(--bg-raised);
    border-radius: 4px; overflow: hidden;
  }
  .xp-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--neon-purple), var(--neon-teal));
    border-radius: 4px;
    transition: width 0.5s cubic-bezier(.4,0,.2,1);
    width: 0%;
  }
  .level-name { font-size: 11px; font-family: var(--font-mono); color: var(--text-3); white-space: nowrap; }
  .level-tag.level-up span, .level-name.level-up { animation: lvlPulse 0.7s ease; }
  @keyframes lvlPulse {
    0%,100% { transform: scale(1); }
    40%     { transform: scale(1.4); color: var(--neon-teal); text-shadow: 0 0 12px var(--neon-teal); }
  }

  /* ── STATS BAR ── */
  .stats-bar {
    width: 100%;
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 14px;
  }
  .stat-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 8px 10px;
    display: flex; flex-direction: column; align-items: center; gap: 2px;
    transition: transform 0.15s, border-color 0.2s;
  }
  .stat-card.bump { transform: translateY(-3px); border-color: var(--border-glow); }
  .stat-label {
    font-size: 9px; text-transform: uppercase; letter-spacing: 0.08em;
    color: var(--text-3); font-family: var(--font-mono);
  }
  .stat-value { font-size: 20px; font-weight: 600; font-family: var(--font-mono); line-height: 1; }
  .stat-value.c-xp     { color: var(--neon-teal); }
  .stat-value.c-hits   { color: var(--neon-purple); }
  .stat-value.c-streak { color: var(--neon-amber); }
  .stat-value.c-time   { color: var(--neon-blue); }

  /* ── DIFFICULTY ── */
  .diff-row { width: 100%; display: flex; gap: 6px; margin-bottom: 14px; }
  .diff-btn {
    flex: 1;
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text-3);
    border-radius: 8px;
    padding: 6px 4px;
    font-size: 11px;
    font-family: var(--font-mono);
    letter-spacing: 0.04em;
    cursor: pointer;
    text-align: center;
    transition: all 0.2s;
  }
  .diff-btn:hover { color: var(--text-2); border-color: var(--border-glow); }
  .diff-btn.sel { border-color: var(--neon-purple); color: var(--neon-purple); background: rgba(155,143,255,0.08); }

  /* ── RULE BOX ── */
  .rule-box {
    width: 100%;
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 18px;
    font-size: 13px;
    color: var(--text-2);
    text-align: center;
    margin-bottom: 12px;
    min-height: 44px;
    display: flex; align-items: center; justify-content: center;
    line-height: 1.5;
    transition: border-color 0.3s, background 0.3s;
  }
  .rule-box.active { border-color: rgba(155,143,255,0.4); }
  .rule-box.flash { animation: ruleFlash 0.45s ease; }
  @keyframes ruleFlash {
    0% { background: rgba(155,143,255,0.18); border-color: var(--neon-purple); }
    100%{ background: var(--bg-card); }
  }
  .rule-box strong { color: var(--neon-purple); font-weight: 700; }

  /* ── GAME AREA ── */
  .game-area {
    width: 100%;
    background: var(--bg-mid);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    position: relative;
    margin-bottom: 12px;
    min-height: 240px;
  }
  .game-area.shake { animation: areaShake 0.32s ease; }
  @keyframes areaShake {
    0%,100% { transform: translateX(0); }
    20% { transform: translateX(-5px); }
    40% { transform: translateX(5px); }
    60% { transform: translateX(-3px); }
    80% { transform: translateX(3px); }
  }

  /* per-round time bar */
  .round-bar-track { position: absolute; top: 0; left: 0; right: 0; height: 3px; background: rgba(255,255,255,0.04); z-index: 5; }
  .round-bar {
    height: 100%; width: 100%;
    background: linear-gradient(90deg, var(--neon-teal), var(--neon-amber));
    transform-origin: left;
  }

  .elements-grid { display: grid; gap: 10px; padding: 20px 16px 16px; }
  .el-slot { aspect-ratio: 1; display: flex; align-items: center; justify-content: center; }

  .game-el {
    width: 100%;
    max-width: 64px;
    aspect-ratio: 1;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    border: 1px solid;
    transition: transform 0.12s ease;
    animation: elPop 0.3s cubic-bezier(.34,1.56,.64,1) both;
    position: relative;
    user-select: none;
  }
  .game-el.size-sm { max-width: 42px; }
  .game-el.size-lg { max-width: 78px; }
  .game-el:hover:not(.hit):not(.miss) { transform: scale(1.1) translateY(-2px); }

  .game-el.shape-circle  { border-radius: 50%; }
  .game-el.shape-square  { border-radius: 6px; }
  .game-el.shape-triangle { clip-path: polygon(50% 8%, 96% 92%, 4% 92%); border-radius: 0; border: none; }
  .game-el.shape-diamond { border-radius: 4px; transform: rotate(45deg); }
  .game-el.shape-diamond:hover:not(.hit):not(.miss) { transform: rotate(45deg) scale(1.1) translateY(-2px); }

  @keyframes elPop { from { opacity:0; transform:scale(0.5); } to { opacity:1; transform:scale(1); } }
  .game-el.shape-diamond { animation: elPopDiamond 0.3s cubic-bezier(.34,1.56,.64,1) both; }
  @keyframes elPopDiamond { from { opacity:0; transform:rotate(45deg) scale(0.5); } to { opacity:1; transform:rotate(45deg) scale(1); } }

  @keyframes elHit {
    0% { transform:scale(1); opacity:1; } 50% { transform:scale(1.3); opacity:0.8; } 100% { transform:scale(0.5); opacity:0; }
  }
  @keyframes elHitDiamond {
    0% { transform:rotate(45deg) scale(1); opacity:1; } 50% { transform:rotate(45deg) scale(1.3); opacity:0.8; } 100% { transform:rotate(45deg) scale(0.5); opacity:0; }
  }
  @keyframes elMiss {
    0%,100% { filter:brightness(1); } 30% { filter:brightness(0.35) saturate(0.2); transform:scale(0.9); } 60% { filter:brightness(1.2); transform:scale(1.05); }
  }

  /* ── RING + PARTICLE FX ── */
  .ring-fx {
    position: absolute; pointer-events: none; z-index: 18;
    width: 56px; height: 56px; border-radius: 50%;
    border: 2px solid var(--neon-teal);
    transform: translate(-50%,-50%);
    animation: ringFx 0.55s cubic-bezier(.2,.7,.3,1) forwards;
  }
  @keyframes ringFx {
    0%   { opacity:0.9; width:18px; height:18px; }
    100% { opacity:0; width:90px; height:90px; }
  }
  .particle {
    position: absolute; width: 7px; height: 7px; border-radius: 50%;
    pointer-events: none; z-index: 18; transform: translate(-50%,-50%);
    animation: partFly 0.6s ease-out forwards;
  }
  @keyframes partFly {
    0% { opacity:1; }
    100% { opacity:0; transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) scale(0.3); }
  }

  /* ── OVERLAYS ── */
  .overlay {
    position: absolute; inset: 0;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 10px; border-radius: 16px; z-index: 10;
    background: rgba(8,8,18,0.92); backdrop-filter: blur(4px);
    padding: 20px; animation: fadeIn 0.25s ease;
  }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  .overlay-title  { font-size: 22px; font-weight: 700; color: var(--neon-purple); text-align: center; }
  .overlay-sub    { font-size: 13px; color: var(--text-2); text-align: center; line-height: 1.6; }
  .overlay-stats  { display: flex; gap: 18px; margin: 8px 0; flex-wrap: wrap; justify-content: center; }
  .ov-stat        { text-align: center; }
  .ov-stat .v     { font-size: 26px; font-weight: 600; font-family: var(--font-mono); color: var(--neon-purple); }
  .ov-stat .l     { font-size: 10px; font-family: var(--font-mono); color: var(--text-3); text-transform:uppercase; letter-spacing:0.06em; margin-top:2px; }
  .ov-stat .v.teal  { color: var(--neon-teal); }
  .ov-stat .v.amber { color: var(--neon-amber); }
  .ov-stat .v.blue  { color: var(--neon-blue); }
  .pause-label { font-size: 15px; color: var(--text-3); letter-spacing: 0.12em; font-family: var(--font-mono); }
  .record-banner {
    font-family: var(--font-mono); font-size: 12px; font-weight: 600;
    color: var(--neon-amber); letter-spacing: 0.05em;
    background: rgba(240,168,64,0.12); border: 1px solid rgba(240,168,64,0.35);
    padding: 5px 14px; border-radius: 20px;
    animation: recPop 0.6s cubic-bezier(.34,1.56,.64,1) both;
  }
  @keyframes recPop { from { opacity:0; transform:scale(0.6);} to {opacity:1; transform:scale(1);} }

  /* ── COUNTDOWN ── */
  .countdown-num {
    font-size: 90px; font-weight: 700; font-family: var(--font-main);
    color: var(--neon-purple); line-height: 1;
    text-shadow: 0 0 40px rgba(155,143,255,0.5);
  }
  .countdown-num.go { color: var(--neon-teal); font-size: 56px; text-shadow: 0 0 40px rgba(68,217,184,0.6); }
  .cd-anim { animation: cdPop 0.7s cubic-bezier(.34,1.56,.64,1); }
  @keyframes cdPop {
    0%   { opacity:0; transform: scale(2.2); }
    30%  { opacity:1; transform: scale(1); }
    100% { opacity:0; transform: scale(0.6); }
  }

  /* ── TOAST ── */
  .toast {
    position: absolute; pointer-events: none; z-index: 20;
    font-size: 15px; font-weight: 600; font-family: var(--font-mono);
    animation: toastRise 0.75s cubic-bezier(.4,0,.2,1) forwards;
  }
  @keyframes toastRise {
    0% { opacity:0; transform:translateY(0) scale(0.8); }
    25%{ opacity:1; transform:translateY(-12px) scale(1.05); }
    70%{ opacity:1; transform:translateY(-28px) scale(1); }
    100%{ opacity:0; transform:translateY(-44px) scale(0.95); }
  }

  /* ── COMBO FLASH ── */
  .combo-badge {
    position: absolute; top: 12px; right: 12px;
    font-size: 12px; font-weight: 600; font-family: var(--font-mono);
    color: var(--neon-amber);
    background: rgba(240,168,64,0.12);
    border: 1px solid rgba(240,168,64,0.3);
    border-radius: 7px; padding: 4px 9px;
    opacity: 0; transition: opacity 0.25s, transform 0.25s;
    pointer-events: none; transform: scale(0.8);
    z-index: 6;
  }
  .combo-badge.show { opacity: 1; transform: scale(1); }
  .combo-badge.hot {
    color: #fff; background: rgba(240,80,120,0.25); border-color: var(--neon-pink);
    box-shadow: 0 0 14px rgba(224,96,160,0.5);
  }

  /* ── REACTION ROW ── */
  .reaction-row { width: 100%; display: flex; justify-content: flex-end; padding: 0 2px; margin-bottom: 10px; min-height: 16px; }
  .reaction-label { font-size: 10px; font-family: var(--font-mono); color: var(--text-3); }

  /* ── BUTTONS ── */
  .btn-row { width: 100%; display: flex; gap: 8px; justify-content: center; }
  .btn {
    border-radius: 10px; padding: 10px 24px;
    font-size: 13px; font-weight: 500; font-family: var(--font-main);
    cursor: pointer; transition: all 0.18s; border: 1px solid;
  }
  .btn-primary { background: rgba(155,143,255,0.15); border-color: var(--neon-purple); color: var(--neon-purple); }
  .btn-primary:hover { background: rgba(155,143,255,0.25); }
  .btn-secondary { background: var(--bg-card); border-color: var(--border); color: var(--text-2); }
  .btn-secondary:hover { border-color: var(--border-glow); color: var(--text-1); }

  /* ── RESPONSIVE ── */
  @media(max-width:400px) {
    .stats-bar { grid-template-columns: repeat(2,1fr); }
    .stat-value { font-size: 16px; }
    .record-pill { display: none; }
  }
</style>
</head>
<body>
<div id="app">

  <!-- HEADER -->
  <div class="header">
    <div class="header-brand">
      <div class="brand-name">Jogo do Foco</div>
      <div class="brand-sub">MODO CONCENTRAÇÃO</div>
    </div>
    <div class="header-controls">
      <div class="record-pill" id="recordPill" title="Seu recorde"><i data-lucide="trophy"></i> <span id="recordVal">0</span></div>
      <button class="icon-btn active" id="soundBtn" title="Sons">🔊</button>
      <button class="icon-btn" id="pauseBtn" title="Pausar" style="display:none">⏸</button>
    </div>
  </div>

  <!-- LEVEL & XP -->
  <div class="level-row">
    <div class="level-tag" id="levelTag">NV <span id="levelNum">1</span></div>
    <div class="xp-track"><div class="xp-fill" id="xpFill"></div></div>
    <div class="level-name" id="levelName">Iniciante</div>
  </div>

  <!-- STATS -->
  <div class="stats-bar">
    <div class="stat-card" id="card-xp"><div class="stat-label">XP</div><div class="stat-value c-xp" id="xpVal">0</div></div>
    <div class="stat-card" id="card-hits"><div class="stat-label">Acertos</div><div class="stat-value c-hits" id="hitsVal">0</div></div>
    <div class="stat-card" id="card-streak"><div class="stat-label">Sequência</div><div class="stat-value c-streak" id="streakVal">0</div></div>
    <div class="stat-card" id="card-time"><div class="stat-label">Tempo</div><div class="stat-value c-time" id="timerVal">0:30</div></div>
  </div>

  <!-- DIFFICULTY -->
  <div class="diff-row" id="diffRow">
    <button class="diff-btn sel" data-d="easy">fácil</button>
    <button class="diff-btn"    data-d="med">médio</button>
    <button class="diff-btn"    data-d="hard">difícil</button>
  </div>

  <!-- RULE -->
  <div class="rule-box" id="ruleBox">
    <span id="ruleText">Pressione <strong>Iniciar</strong> para começar</span>
  </div>

  <!-- GAME AREA -->
  <div class="game-area" id="gameArea">
    <div class="round-bar-track"><div class="round-bar" id="roundBar"></div></div>
    <div class="elements-grid" id="elemGrid"></div>
    <div class="combo-badge" id="comboBadge"></div>

    <!-- Start Overlay -->
    <div class="overlay" id="startOverlay">
      <div class="overlay-title">Jogo do Foco</div>
      <div class="overlay-sub">Leia a regra e clique<br>apenas nos elementos corretos.<br>Seja rápido: cada rodada tem tempo!</div>
    </div>
  </div>

  <!-- REACTION -->
  <div class="reaction-row">
    <div class="reaction-label" id="reactionLabel"></div>
  </div>

  <!-- BUTTONS -->
  <div class="btn-row">
    <button class="btn btn-primary" id="startBtn"><i data-lucide="play"></i> Iniciar</button>
    <button class="btn btn-secondary" id="restartBtn" style="display:none">↺ Reiniciar</button>
  </div>

</div>

<script>
(function(){
  /* ─── CONFIG ─────────────────────────────── */
  const COLORS = {
    azul:    { bg:'#0e1f4a', border:'#3060b8', glow:'rgba(48,96,184,0.4)',  label:'azuis'    },
    roxo:    { bg:'#1c0f4a', border:'#7040c0', glow:'rgba(112,64,192,0.4)', label:'roxas'    },
    verde:   { bg:'#0a2018', border:'#28906a', glow:'rgba(40,144,106,0.4)', label:'verdes'   },
    laranja: { bg:'#2a1502', border:'#c06828', glow:'rgba(192,104,40,0.4)', label:'laranjas' },
    rosa:    { bg:'#2a0818', border:'#b82870', glow:'rgba(184,40,112,0.4)', label:'rosas'    },
    ciano:   { bg:'#031e2e', border:'#28a8b8', glow:'rgba(40,168,184,0.4)', label:'cianas'   },
  };
  const SHAPES = ['circle','square','triangle','diamond'];
  const SHAPE_NAMES_PLURAL = { circle:'círculos', square:'quadrados', triangle:'triângulos', diamond:'losangos' };
  const SHAPE_NAMES_SING   = { circle:'círculo',  square:'quadrado',  triangle:'triângulo',  diamond:'losango'  };
  const COLOR_KEYS = Object.keys(COLORS);
  const SIZES = ['sm','lg'];
  const SIZE_LABEL = { sm:'pequenas', lg:'grandes' };
  const DIFF = {
    easy: { cols:3, rows:2, sec:30, round:4200, label:'fácil'   },
    med:  { cols:4, rows:3, sec:35, round:3400, label:'médio'   },
    hard: { cols:4, rows:4, sec:40, round:2700, label:'difícil' },
  };
  const LEVEL_XP    = [0, 80, 200, 400, 700, 1100, 1700, 2500];
  const LEVEL_NAMES = ['Iniciante','Focado','Atento','Concentrado','Preciso','Agudo','Expert','Mestre'];

  const STORE_KEY = 'ma-foco-stats';

  /* ─── PERSISTÊNCIA (recordes locais do jogo) ─── */
  function loadStats() {
    try { return JSON.parse(localStorage.getItem(STORE_KEY) || '{}') || {}; }
    catch(e){ return {}; }
  }
  function saveStats(s) {
    try { localStorage.setItem(STORE_KEY, JSON.stringify(s)); } catch(e){}
  }
  let records = Object.assign({ bestXp:0, bestAcc:0, bestCombo:0, games:0 }, loadStats());

  /* ─── STATE ──────────────────────────────── */
  let g = {
    running:false, paused:false, diff:'easy',
    xp:0, hits:0, streak:0, misses:0,
    level:1, roundSec:30, elapsed:0,
    rule:null, elements:[], soundOn:true,
    reactionTimes:[], lastSpawn:0, combo:0, bestCombo:0,
    ticker:null, roundTo:null,
  };

  /* ─── AUDIO ──────────────────────────────── */
  function tone(type) {
    if(!g.soundOn) return;
    try {
      const ac = new (window.AudioContext || window.webkitAudioContext)();
      const o = ac.createOscillator(), gn = ac.createGain();
      o.connect(gn); gn.connect(ac.destination);
      if(type==='hit') {
        o.type='sine';
        o.frequency.setValueAtTime(550, ac.currentTime);
        o.frequency.exponentialRampToValueAtTime(880, ac.currentTime+0.1);
        gn.gain.setValueAtTime(0.15, ac.currentTime);
        gn.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+0.28);
        o.start(); o.stop(ac.currentTime+0.28);
      } else if(type==='combo') {
        o.type='sine';
        o.frequency.setValueAtTime(660, ac.currentTime);
        o.frequency.exponentialRampToValueAtTime(1320, ac.currentTime+0.14);
        gn.gain.setValueAtTime(0.12, ac.currentTime);
        gn.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+0.3);
        o.start(); o.stop(ac.currentTime+0.3);
      } else if(type==='count') {
        o.type='sine';
        o.frequency.setValueAtTime(440, ac.currentTime);
        gn.gain.setValueAtTime(0.1, ac.currentTime);
        gn.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+0.18);
        o.start(); o.stop(ac.currentTime+0.18);
      } else {
        o.type='triangle';
        o.frequency.setValueAtTime(260, ac.currentTime);
        o.frequency.exponentialRampToValueAtTime(170, ac.currentTime+0.22);
        gn.gain.setValueAtTime(0.1, ac.currentTime);
        gn.gain.exponentialRampToValueAtTime(0.001, ac.currentTime+0.32);
        o.start(); o.stop(ac.currentTime+0.32);
      }
    } catch(e){}
  }

  /* ─── RULE GENERATION ────────────────────── */
  function genRule() {
    // odd_one_out só faz sentido sem combinação de tamanho; demais sempre disponíveis
    const types = ['color_only','shape_only','not_color','odd_one_out','size_only','color_shape'];
    const t = types[Math.floor(Math.random()*types.length)];
    if(t==='color_only') {
      const c = COLOR_KEYS[Math.floor(Math.random()*COLOR_KEYS.length)];
      return { type:'color_only', color:c, useSize:false,
        text:`Clique apenas nas formas <strong>${COLORS[c].label}</strong>` };
    } else if(t==='shape_only') {
      const s = SHAPES[Math.floor(Math.random()*SHAPES.length)];
      return { type:'shape_only', shape:s, useSize:false,
        text:`Clique apenas nos <strong>${SHAPE_NAMES_PLURAL[s]}</strong>` };
    } else if(t==='not_color') {
      const c = COLOR_KEYS[Math.floor(Math.random()*COLOR_KEYS.length)];
      return { type:'not_color', color:c, useSize:false,
        text:`Clique nas que <strong>NÃO</strong> são <strong>${COLORS[c].label}</strong>` };
    } else if(t==='size_only') {
      const sz = SIZES[Math.floor(Math.random()*SIZES.length)];
      return { type:'size_only', size:sz, useSize:true,
        text:`Clique apenas nas formas <strong>${SIZE_LABEL[sz]}</strong>` };
    } else if(t==='color_shape') {
      const c = COLOR_KEYS[Math.floor(Math.random()*COLOR_KEYS.length)];
      const s = SHAPES[Math.floor(Math.random()*SHAPES.length)];
      return { type:'color_shape', color:c, shape:s, useSize:false,
        text:`Clique nos <strong>${SHAPE_NAMES_PLURAL[s]} ${COLORS[c].label}</strong>` };
    } else {
      return { type:'odd_one_out', useSize:false, text:'Clique na forma <strong>diferente</strong> das outras' };
    }
  }

  function isCorrect(el) {
    const r = g.rule;
    if(!r) return false;
    if(r.type==='color_only')  return el.color===r.color;
    if(r.type==='shape_only')  return el.shape===r.shape;
    if(r.type==='not_color')   return el.color!==r.color;
    if(r.type==='size_only')   return el.size===r.size;
    if(r.type==='color_shape') return el.color===r.color && el.shape===r.shape;
    if(r.type==='odd_one_out') return el.isOdd===true;
    return false;
  }

  function randSize(useSize) {
    return useSize ? SIZES[Math.floor(Math.random()*SIZES.length)] : 'md';
  }

  function buildElements() {
    const d = DIFF[g.diff];
    const total = d.cols * d.rows;
    const useSize = !!g.rule.useSize;
    const els = [];

    if(g.rule.type==='odd_one_out') {
      const bc = COLOR_KEYS[Math.floor(Math.random()*COLOR_KEYS.length)];
      const bs = SHAPES[Math.floor(Math.random()*SHAPES.length)];
      let oc; do { oc=COLOR_KEYS[Math.floor(Math.random()*COLOR_KEYS.length)]; } while(oc===bc);
      let os; do { os=SHAPES[Math.floor(Math.random()*SHAPES.length)]; } while(os===bs);
      const oi = Math.floor(Math.random()*total);
      for(let i=0;i<total;i++)
        els.push(i===oi
          ? {id:i, color:oc, shape:os, size:'md', isOdd:true}
          : {id:i, color:bc, shape:bs, size:'md', isOdd:false});
    } else {
      for(let i=0;i<total;i++)
        els.push({id:i,
          color: COLOR_KEYS[Math.floor(Math.random()*COLOR_KEYS.length)],
          shape: SHAPES[Math.floor(Math.random()*SHAPES.length)],
          size: randSize(useSize),
          isOdd: false});
      // garante ao menos um elemento correto
      if(!els.some(e=>isCorrect(e))) {
        const i = Math.floor(Math.random()*els.length);
        if(g.rule.type==='color_only')      els[i].color = g.rule.color;
        else if(g.rule.type==='shape_only') els[i].shape = g.rule.shape;
        else if(g.rule.type==='size_only')  els[i].size  = g.rule.size;
        else if(g.rule.type==='color_shape'){ els[i].color = g.rule.color; els[i].shape = g.rule.shape; }
        else if(g.rule.type==='not_color') {
          let nc; do { nc=COLOR_KEYS[Math.floor(Math.random()*COLOR_KEYS.length)]; } while(nc===g.rule.color);
          els[i].color = nc;
        }
      }
    }
    return els;
  }

  /* ─── RENDER ─────────────────────────────── */
  const grid = document.getElementById('elemGrid');
  const gameArea = document.getElementById('gameArea');
  const roundBar = document.getElementById('roundBar');

  function renderGrid() {
    const d = DIFF[g.diff];
    grid.style.gridTemplateColumns = `repeat(${d.cols}, 1fr)`;
    grid.innerHTML = '';
    g.elements.forEach(el => {
      const slot = document.createElement('div');
      slot.className = 'el-slot';
      const div = document.createElement('div');
      const c = COLORS[el.color];
      div.className = `game-el shape-${el.shape}` + (el.size!=='md' ? ` size-${el.size}` : '');
      div.style.background = c.bg;
      if(el.shape!=='triangle') {
        div.style.borderColor = c.border;
        div.style.boxShadow = `0 0 10px ${c.glow}, inset 0 0 12px ${c.glow}`;
      } else {
        div.style.background = `linear-gradient(180deg, ${c.bg} 0%, ${c.border}88 100%)`;
        div.style.filter = `drop-shadow(0 0 5px ${c.border})`;
      }
      div.style.animationDelay = (Math.random()*0.12)+'s';
      div.addEventListener('click', ()=> onClick(el, div));
      slot.appendChild(div);
      grid.appendChild(slot);
    });
    g.lastSpawn = Date.now();
    startRoundTimer();
  }

  /* ─── TIMER POR RODADA ───────────────────── */
  function roundDuration() {
    // encurta conforme o nível sobe → tensão crescente
    const base = DIFF[g.diff].round;
    return Math.max(1500, base - (g.level-1)*180);
  }
  function startRoundTimer() {
    clearTimeout(g.roundTo);
    const dur = roundDuration();
    roundBar.style.transition = 'none';
    roundBar.style.transform = 'scaleX(1)';
    void roundBar.offsetWidth;            // reflow
    roundBar.style.transition = `transform ${dur}ms linear`;
    roundBar.style.transform = 'scaleX(0)';
    g.roundTo = setTimeout(()=>{ if(g.running && !g.paused) onRoundExpire(); }, dur);
  }
  function onRoundExpire() {
    // tempo esgotado: zera combo (sem punir XP) e troca a rodada
    if(g.combo > 0) { g.combo = 0; updateCombo(); }
    refreshGrid();
  }

  /* ─── CLICK HANDLER ──────────────────────── */
  function onClick(el, div) {
    if(!g.running || g.paused) return;
    const rt = Date.now() - g.lastSpawn;
    g.reactionTimes.push(rt);

    if(isCorrect(el)) {
      g.hits++;
      g.streak++;
      g.combo++;
      if(g.combo > g.bestCombo) g.bestCombo = g.combo;
      const bonus = g.combo>=8?4: g.combo>=5?3: g.combo>=3?2:1;
      const xpGain = 10*bonus;
      g.xp += xpGain;
      tone(g.combo>=3 ? 'combo' : 'hit');
      div.style.pointerEvents = 'none';
      div.style.animation = `${el.shape==='diamond'?'elHitDiamond':'elHit'} 0.38s ease forwards`;
      ringFx(div); particles(div, COLORS[el.color].border);
      spawnToast('+'+xpGain, '#44d9b8', div);
      bumpCard('card-xp'); bumpCard('card-hits');
      updateCombo();
      const avgRt = Math.round(g.reactionTimes.slice(-5).reduce((a,b)=>a+b,0)/Math.min(5,g.reactionTimes.length));
      document.getElementById('reactionLabel').textContent = 'reação: '+avgRt+'ms';
      setTimeout(refreshGrid, 320);
    } else {
      g.misses++;
      g.streak=0; g.combo=0;
      tone('miss');
      div.style.animation = 'elMiss 0.4s ease';
      spawnToast('ops', '#e05070', div);
      gameArea.classList.add('shake');
      setTimeout(()=>{ div.style.animation=''; gameArea.classList.remove('shake'); }, 400);
      updateCombo();
    }
    updateUI();
    checkLevel();
  }

  /* ─── EFEITOS ────────────────────────────── */
  function fxPos(anchor) {
    const r = anchor.getBoundingClientRect();
    const a = gameArea.getBoundingClientRect();
    return { x: r.left - a.left + r.width/2, y: r.top - a.top + r.height/2 };
  }
  function ringFx(anchor) {
    const p = fxPos(anchor);
    const ring = document.createElement('div');
    ring.className = 'ring-fx';
    ring.style.left = p.x+'px'; ring.style.top = p.y+'px';
    gameArea.appendChild(ring);
    setTimeout(()=>ring.remove(), 560);
  }
  function particles(anchor, color) {
    const p = fxPos(anchor);
    const n = 7;
    for(let i=0;i<n;i++){
      const part = document.createElement('div');
      part.className = 'particle';
      part.style.left = p.x+'px'; part.style.top = p.y+'px';
      part.style.background = color || '#44d9b8';
      const ang = (Math.PI*2*i/n) + Math.random()*0.5;
      const dist = 26 + Math.random()*22;
      part.style.setProperty('--dx', Math.cos(ang)*dist+'px');
      part.style.setProperty('--dy', Math.sin(ang)*dist+'px');
      gameArea.appendChild(part);
      setTimeout(()=>part.remove(), 620);
    }
  }
  function bumpCard(id) {
    const c = document.getElementById(id);
    c.classList.add('bump');
    setTimeout(()=>c.classList.remove('bump'), 160);
  }

  /* ─── TOAST ──────────────────────────────── */
  function spawnToast(txt, color, anchor) {
    const p = fxPos(anchor);
    const t = document.createElement('div');
    t.className = 'toast';
    t.textContent = txt;
    t.style.color = color;
    t.style.left = (p.x - 20) + 'px';
    t.style.top  = (p.y - 24) + 'px';
    gameArea.appendChild(t);
    setTimeout(()=>t.remove(), 750);
  }

  /* ─── COMBO ──────────────────────────────── */
  function updateCombo() {
    const cb = document.getElementById('comboBadge');
    if(g.combo>=3) {
      cb.textContent = g.combo+'x combo!';
      cb.classList.add('show');
      cb.classList.toggle('hot', g.combo>=5);
      clearTimeout(cb._t);
      cb._t = setTimeout(()=>cb.classList.remove('show'), 1100);
    } else {
      cb.classList.remove('show','hot');
    }
  }

  /* ─── REFRESH ────────────────────────────── */
  function refreshGrid() {
    if(!g.running) return;
    g.rule = genRule();
    g.elements = buildElements();
    const rb = document.getElementById('ruleBox');
    document.getElementById('ruleText').innerHTML = g.rule.text;
    rb.classList.add('active');
    rb.classList.remove('flash'); void rb.offsetWidth; rb.classList.add('flash');
    renderGrid();
  }

  /* ─── UI UPDATE ──────────────────────────── */
  function updateUI() {
    document.getElementById('xpVal').textContent   = g.xp;
    document.getElementById('hitsVal').textContent = g.hits;
    document.getElementById('streakVal').textContent = g.streak;
    const rem = Math.max(0, g.roundSec - g.elapsed);
    const m=Math.floor(rem/60), s=rem%60;
    document.getElementById('timerVal').textContent = m+':'+(s<10?'0':'')+s;
    const xpStart = LEVEL_XP[Math.max(0,g.level-1)];
    const xpEnd   = LEVEL_XP[Math.min(g.level, LEVEL_XP.length-1)];
    const pct = xpEnd>xpStart ? Math.min(100,((g.xp-xpStart)/(xpEnd-xpStart))*100) : 100;
    document.getElementById('xpFill').style.width = Math.max(0,pct)+'%';
  }

  function checkLevel() {
    for(let i=LEVEL_XP.length-1;i>=0;i--) {
      if(g.xp>=LEVEL_XP[i] && (i+1)!==g.level) {
        const up = (i+1) > g.level;
        g.level = i+1;
        document.getElementById('levelNum').textContent  = g.level;
        document.getElementById('levelName').textContent = LEVEL_NAMES[Math.min(g.level-1,LEVEL_NAMES.length-1)];
        if(up) {
          tone('combo');
          ['levelTag','levelName'].forEach(id=>{
            const e=document.getElementById(id);
            e.classList.remove('level-up'); void e.offsetWidth; e.classList.add('level-up');
          });
        }
        break;
      }
    }
  }

  function updateRecordPill() {
    document.getElementById('recordVal').textContent = records.bestXp || 0;
  }

  /* ─── GAME FLOW ──────────────────────────── */
  function removeOverlays() { document.querySelectorAll('.overlay').forEach(o=>o.remove()); }

  function runCountdown(cb) {
    removeOverlays();
    const ov = document.createElement('div');
    ov.className = 'overlay'; ov.id = 'cdOverlay';
    const num = document.createElement('div');
    num.className = 'countdown-num';
    ov.appendChild(num);
    gameArea.appendChild(ov);
    const seq = ['3','2','1','FOCO!'];
    let i = 0;
    function step() {
      if(i >= seq.length) { ov.remove(); cb(); return; }
      num.textContent = seq[i];
      num.classList.toggle('go', seq[i]==='FOCO!');
      num.classList.remove('cd-anim'); void num.offsetWidth; num.classList.add('cd-anim');
      tone(i===seq.length-1 ? 'hit' : 'count');
      i++;
      setTimeout(step, 700);
    }
    step();
  }

  function beginRound() {
    g.running = true;
    refreshGrid();
    clearInterval(g.ticker);
    g.ticker = setInterval(()=>{
      if(g.paused || !g.running) return;
      g.elapsed++;
      updateUI();
      if(g.elapsed>=g.roundSec) endGame();
    }, 1000);
    updateUI();
  }

  function startGame() {
    Object.assign(g, {
      running:false, paused:false,
      hits:0, streak:0, misses:0, elapsed:0,
      reactionTimes:[], combo:0, bestCombo:0,
      roundSec: DIFF[g.diff].sec, level:1
    });
    document.getElementById('startBtn').style.display   = 'none';
    document.getElementById('restartBtn').style.display = 'inline-block';
    document.getElementById('pauseBtn').style.display   = 'inline-block';
    document.getElementById('pauseBtn').textContent     = '⏸';
    document.getElementById('diffRow').style.pointerEvents = 'none';
    document.getElementById('diffRow').style.opacity       = '0.4';
    document.getElementById('reactionLabel').textContent   = '';
    document.getElementById('levelNum').textContent  = '1';
    document.getElementById('levelName').textContent = LEVEL_NAMES[0];
    document.getElementById('xpFill').style.width    = '0%';
    document.getElementById('comboBadge').classList.remove('show','hot');
    updateUI();
    runCountdown(beginRound);
  }

  function endGame() {
    g.running = false;
    clearInterval(g.ticker);
    clearTimeout(g.roundTo);
    roundBar.style.transition = 'none';
    roundBar.style.transform = 'scaleX(0)';
    document.getElementById('pauseBtn').style.display='none';
    document.getElementById('diffRow').style.pointerEvents = '';
    document.getElementById('diffRow').style.opacity       = '1';
    removeOverlays();

    const total = g.hits+g.misses;
    const pct   = total>0 ? Math.round(g.hits/total*100) : 0;
    const avgRt = g.reactionTimes.length>0
      ? Math.round(g.reactionTimes.reduce((a,b)=>a+b,0)/g.reactionTimes.length) : 0;

    // ── recordes locais ──
    const newRecords = [];
    if(g.xp > (records.bestXp||0))           { records.bestXp = g.xp;            newRecords.push('XP'); }
    if(pct > (records.bestAcc||0))           { records.bestAcc = pct;            newRecords.push('precisão'); }
    if(g.bestCombo > (records.bestCombo||0)) { records.bestCombo = g.bestCombo;  newRecords.push('combo'); }
    records.games = (records.games||0) + 1;
    saveStats(records);
    updateRecordPill();

    const msg = pct>=80?'Foco excelente!': pct>=60?'Bom desempenho!':'Continue praticando!';

    // Conecta ao sistema de progresso/medalhas.
    if (window.MAProgress) {
      MAProgress.recordGame({
        name: 'Jogo do Foco', icon: '🎯',
        xp: MAProgress.clamp(Math.round(g.xp), 10, 200),
        score: g.hits
      });
    }

    const lvlName = LEVEL_NAMES[Math.min(g.level-1,LEVEL_NAMES.length-1)];
    const ov = document.createElement('div');
    ov.className='overlay'; ov.id='endOverlay';
    ov.innerHTML=`
      <div class="overlay-title">${msg}</div>
      ${newRecords.length ? `<div class="record-banner">🏆 Novo recorde de ${newRecords.join(' e ')}!</div>` : ''}
      <div class="overlay-stats">
        <div class="ov-stat"><div class="v">${g.hits}</div><div class="l">acertos</div></div>
        <div class="ov-stat"><div class="v teal">${pct}%</div><div class="l">precisão</div></div>
        <div class="ov-stat"><div class="v amber">${g.bestCombo}x</div><div class="l">combo máx</div></div>
        <div class="ov-stat"><div class="v blue">${avgRt}ms</div><div class="l">reação</div></div>
      </div>
      <div class="overlay-sub">Nível <strong style="color:var(--neon-purple)">${g.level}</strong> — ${lvlName}<br>
        <span style="color:var(--text-3);font-family:var(--font-mono);font-size:11px">recorde de XP: ${records.bestXp} · ${records.games} partidas</span>
      </div>
    `;
    gameArea.appendChild(ov);
  }

  /* ─── CONTROLS ───────────────────────────── */
  document.getElementById('startBtn').addEventListener('click', startGame);
  document.getElementById('restartBtn').addEventListener('click', ()=>{
    clearInterval(g.ticker);
    clearTimeout(g.roundTo);
    removeOverlays();
    startGame();
  });
  document.getElementById('pauseBtn').addEventListener('click', ()=>{
    if(!g.running) return;
    g.paused = !g.paused;
    document.getElementById('pauseBtn').textContent = g.paused?'▶':'⏸';
    if(g.paused) {
      clearTimeout(g.roundTo);
      const cur = getComputedStyle(roundBar).transform;   // congela no ponto atual
      roundBar.style.transition = 'none';
      roundBar.style.transform = (cur && cur !== 'none') ? cur : 'scaleX(0)';
      const ov=document.createElement('div'); ov.className='overlay'; ov.id='pauseOverlay';
      ov.innerHTML='<div class="pause-label">PAUSADO</div><div class="overlay-sub" style="font-size:12px">Pressione ▶ para continuar</div>';
      gameArea.appendChild(ov);
    } else {
      const po=document.getElementById('pauseOverlay'); if(po) po.remove();
      startRoundTimer();   // reinicia a rodada atual
    }
  });
  document.getElementById('soundBtn').addEventListener('click', ()=>{
    g.soundOn=!g.soundOn;
    const btn=document.getElementById('soundBtn');
    btn.textContent = g.soundOn?'🔊':'🔇';
    btn.classList.toggle('active', g.soundOn);
  });
  document.querySelectorAll('.diff-btn').forEach(btn=>{
    btn.addEventListener('click', ()=>{
      if(g.running) return;
      document.querySelectorAll('.diff-btn').forEach(b=>b.classList.remove('sel'));
      btn.classList.add('sel');
      g.diff = btn.dataset.d;
    });
  });

  updateRecordPill();
  updateUI();
})();
</script>
